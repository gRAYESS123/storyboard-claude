<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    /* ============================================================
       RESET + ASPECT-LOCKED 1920x1080 CANVAS
    ============================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .stage {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .deck {
      width: 1920px; height: 1080px;
      transform-origin: center;
      overflow-y: scroll; overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      will-change: transform;
      backface-visibility: hidden;
    }
    .deck::-webkit-scrollbar { display: none; }

    /* ============================================================
       DESIGN TOKENS
    ============================================================ */
    :root {
      --paper:       #FFFFFF;
      --ink:         #1B1B19;
      --ink-soft:    #5A5A55;
      --accent:      #3CA8E8;
      --accent-deep: #2A4DA3;
      --accent-hot:  #E8762C;
      --muted:       #EDEDED;
      --highlight:   #FFE066;
      --shadow-card: 0 12px 32px rgba(20, 30, 50, 0.10), 0 4px 12px rgba(20, 30, 50, 0.06);
      --shadow-big:  0 24px 48px rgba(20, 30, 50, 0.14), 0 8px 16px rgba(20, 30, 50, 0.08);
      --shadow-glow: 0 0 60px rgba(60, 168, 232, 0.45);
    }

    /* ============================================================
       SLIDE BASE
    ============================================================ */
    .slide {
      width: 1920px; height: 1080px;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow: hidden;
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      contain: layout paint;
      transform: translateZ(0);
    }
    .slide.dark { background: var(--ink); color: #fff; }

    /* ============================================================
       LEGACY .fade-up — kept for simple decks
    ============================================================ */
    .fade-up {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, opacity;
    }
    .slide.is-visible .fade-up { opacity: 1; transform: translateY(0); }
    .slide.is-visible .d1 { transition-delay: 0.18s; }
    .slide.is-visible .d2 { transition-delay: 0.34s; }
    .slide.is-visible .d3 { transition-delay: 0.50s; }
    .slide.is-visible .d4 { transition-delay: 0.66s; }
    .slide.is-visible .d5 { transition-delay: 0.82s; }

    /* ============================================================
       ANIM ENGINE — opacity 0 until first activation
    ============================================================ */
    .anim { opacity: 0; will-change: transform, opacity, filter; }
    .anim.anim-static { opacity: 1; }
    .anim.anim-played { opacity: 1; }

    /* ============================================================
       SLIDE TYPE: HERO
    ============================================================ */
    .slide-center { width: 100%; max-width: 1500px; text-align: center; }
    .s-title {
      font-size: 132px; line-height: 1.02; font-weight: 800;
      letter-spacing: -0.025em; color: var(--ink);
    }
    .s-eyebrow {
      font-size: 18px; font-weight: 700;
      letter-spacing: 0.26em; text-transform: uppercase;
      color: var(--accent-deep); margin-bottom: 40px;
    }
    .s-subtitle {
      font-size: 32px; line-height: 1.4; color: var(--ink-soft);
      margin-top: 32px; max-width: 1100px; margin-left: auto; margin-right: auto;
    }

    /* Gradient-fill headlines (animatable via gradientSweep) */
    .gradient-fill {
      background: linear-gradient(110deg, var(--accent), var(--accent-deep), var(--accent-hot));
      background-size: 220% 100%;
      background-position: 0% 50%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }

    /* ============================================================
       SLIDE TYPE: CINEMATIC
    ============================================================ */
    .scene-cinematic { padding: 0; background: #000; }
    .scene-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: saturate(0.92);
      transform-origin: 50% 50%;
    }
    .scene-bg-veil {
      position: absolute; inset: 0;
      background: linear-gradient(135deg,
        rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.35) 60%, rgba(0,0,0,0.55) 100%);
    }
    .scene-content {
      position: relative; z-index: 2;
      width: 100%; max-width: 1300px;
      padding: 100px; color: #fff;
    }
    .scene-tag {
      display: inline-block;
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #fff; background: var(--accent);
      padding: 8px 18px; border-radius: 999px;
      margin-bottom: 28px;
    }
    .scene-headline {
      font-size: 96px; line-height: 1.05; font-weight: 800;
      letter-spacing: -0.02em; margin-bottom: 28px;
    }
    .scene-body { font-size: 30px; line-height: 1.45; max-width: 1000px; opacity: 0.92; }

    /* Vignette overlay for moody shots */
    .scene-vignette {
      position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 240px 80px rgba(0,0,0,0.7);
      z-index: 3;
    }

    /* ============================================================
       SLIDE TYPE: LIST
    ============================================================ */
    .list-wrap { width: 100%; max-width: 1400px; }
    .list-title {
      font-size: 76px; line-height: 1.08; font-weight: 800;
      letter-spacing: -0.02em; color: var(--ink); margin-bottom: 56px;
    }
    .list-items { list-style: none; display: flex; flex-direction: column; gap: 22px; }
    .list-items li {
      display: flex; align-items: baseline; gap: 24px;
      font-size: 36px; line-height: 1.35; color: var(--ink);
    }
    .list-items li .num {
      color: var(--accent-deep); font-weight: 800;
      font-variant-numeric: tabular-nums; min-width: 56px;
    }

    /* ============================================================
       SLIDE TYPE: STAT
    ============================================================ */
    .stat-wrap { text-align: center; max-width: 1400px; }
    .stat-number {
      font-size: 280px; line-height: 0.92;
      font-weight: 900; letter-spacing: -0.035em;
      color: var(--accent-deep);
      font-variant-numeric: tabular-nums;
    }
    .stat-caption {
      font-size: 40px; line-height: 1.35; color: var(--ink-soft);
      margin-top: 36px; max-width: 1100px;
      margin-left: auto; margin-right: auto;
    }

    /* ============================================================
       SLIDE TYPE: TWO-COLUMN
    ============================================================ */
    .twocol {
      display: grid; gap: 80px;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      width: 100%; max-width: 1700px;
    }
    .twocol-text h2 {
      font-size: 72px; line-height: 1.05; font-weight: 800;
      letter-spacing: -0.02em; color: var(--ink); margin-bottom: 32px;
    }
    .twocol-text p { font-size: 28px; line-height: 1.5; color: var(--ink-soft); }
    .twocol-media {
      aspect-ratio: 4/3;
      background-size: cover; background-position: center;
      border-radius: 20px; box-shadow: var(--shadow-big);
    }

    /* ============================================================
       SLIDE TYPE: DIAGRAM
    ============================================================ */
    .diagram-wrap {
      width: 100%; max-width: 1500px;
      display: flex; flex-direction: column; align-items: center;
      gap: 48px;
    }
    .diagram-title {
      font-size: 60px; font-weight: 800; letter-spacing: -0.02em;
      color: var(--ink); text-align: center;
    }
    .diagram-svg { width: 100%; height: 600px; }
    .diagram-svg .draw {
      fill: none; stroke: var(--accent); stroke-width: 4;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* ============================================================
       SLIDE TYPE: PARTICLES — for atmospheric layers
    ============================================================ */
    .particle-layer {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
    }
    .particle-layer circle, .particle-layer rect {
      fill: rgba(60, 168, 232, 0.5);
    }

    /* ============================================================
       SLIDE TYPE: FIGURE — for SVG character/illustrative scenes
    ============================================================ */
    .figure-stage {
      width: 100%; max-width: 1500px;
      display: flex; flex-direction: column; align-items: center; gap: 40px;
    }
    .figure-svg { width: 100%; height: 700px; }
    .figure-caption {
      font-size: 36px; font-weight: 700; color: var(--ink);
      text-align: center; max-width: 1100px;
    }

    /* ============================================================
       SLIDE TYPE: LOTTIE container
    ============================================================ */
    .lottie-wrap {
      width: 100%; max-width: 1600px;
      display: flex; align-items: center; justify-content: center;
      gap: 80px;
    }
    .lottie-stage {
      width: 800px; height: 800px;
      position: relative;
    }
    .lottie-text { max-width: 700px; }
    .lottie-text h2 {
      font-size: 64px; line-height: 1.08; font-weight: 800;
      letter-spacing: -0.02em; color: var(--ink); margin-bottom: 24px;
    }
    .lottie-text p {
      font-size: 28px; line-height: 1.45; color: var(--ink-soft);
    }

    /* ============================================================
       SLIDE TYPE: CTA / CLOSE
    ============================================================ */
    .cta-wrap { text-align: center; max-width: 1500px; }
    .cta-title {
      font-size: 110px; line-height: 1.05; font-weight: 800;
      letter-spacing: -0.02em; color: var(--ink);
    }
    .cta-body {
      font-size: 32px; line-height: 1.45;
      color: var(--ink-soft); margin-top: 32px;
    }
    .cta-pill {
      display: inline-block; margin-top: 48px;
      padding: 22px 44px;
      background: var(--ink); color: #fff;
      border-radius: 999px;
      font-size: 28px; font-weight: 700; letter-spacing: 0.04em;
    }

    /* ============================================================
       CAMERA LAYER — for cameraZoom / cameraPan
       Apply transforms to slide content via this wrapper.
       Each slide can have <div class="camera">...</div>
    ============================================================ */
    .camera {
      position: relative; width: 100%; height: 100%;
      transform-origin: center center;
      will-change: transform, filter;
    }

    /* ============================================================
       SCENE TRANSITIONS — overlay played at each slide cue
    ============================================================ */
    .transition-overlay {
      position: fixed; inset: 0; z-index: 9000; pointer-events: none;
      opacity: 0; will-change: opacity, transform, clip-path;
    }
    .transition-overlay.dissolve { background: #000; }
    .transition-overlay.flash    { background: #fff; }
    .transition-overlay.whipPan {
      background: linear-gradient(90deg, transparent, #000 50%, transparent);
      transform: translateX(-100%);
    }
    .transition-overlay.wipe {
      background: var(--accent-deep);
      clip-path: inset(0 100% 0 0);
    }
    .transition-overlay.blocks {
      /* hard cut accent — colored block flash */
      background: var(--accent-hot);
    }

    /* ============================================================
       PLAY CONTROLS
    ============================================================ */
    .play-controls {
      position: fixed;
      top: 12px; right: 12px;
      display: flex; gap: 8px;
      z-index: 9999;
      opacity: 0.42;
    }
    .play-controls button {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(12, 18, 32, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0; color: rgba(255, 255, 255, 0.95);
    }
    .play-controls button svg { width: 14px; height: 14px; fill: currentColor; }
    .play-controls .icon-pause { display: none; }
    .play-controls.is-playing .icon-play { display: none; }
    .play-controls.is-playing .icon-pause { display: block; }

    .play-progress {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      background: var(--accent);
      z-index: 9998;
      width: 0%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .play-progress.is-active { opacity: 0.75; }

    .jump-menu {
      position: fixed;
      top: 56px; right: 12px;
      width: 320px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      background: rgba(12, 18, 32, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 6px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.2s, transform 0.2s;
      backdrop-filter: blur(8px);
    }
    .jump-menu.is-open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .jump-menu button {
      display: flex; align-items: baseline; gap: 10px;
      width: 100%; padding: 7px 12px;
      background: transparent; border: none; border-radius: 6px;
      color: rgba(255, 255, 255, 0.85);
      font: 12.5px/1.35 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: left; cursor: pointer;
    }
    .jump-menu button .jm-num {
      font-weight: 700; color: var(--accent);
      font-variant-numeric: tabular-nums; min-width: 22px;
      font-size: 11px; letter-spacing: 0.06em;
    }
    .jump-menu button .jm-title { flex: 1; }
    .jump-menu button.is-active { background: rgba(60, 168, 232, 0.22); color: #fff; }
    .jump-menu button.is-active .jm-num { color: #fff; }
    .jump-menu::-webkit-scrollbar { width: 6px; }
    .jump-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
  </style>
</head>
<body>

  <div class="stage">
    <div class="deck" id="deck">

      <!-- HERO with gradientSweep title + typewriter eyebrow -->
      <section class="slide" data-slide="1" data-transition-in="cut">
        <div class="camera">
          <div class="slide-center">
            <p class="s-eyebrow anim" data-anim="typewriter" data-t-rel="0.2" data-dur="1.4">{{EYEBROW}}</p>
            <h1 class="s-title gradient-fill anim" data-anim="gradientSweep" data-t-rel="1.5" data-dur="2.0">{{HERO_TITLE}}</h1>
            <p class="s-subtitle anim" data-anim="fadeUp" data-t-rel="3.2" data-dur="1.0">{{HERO_SUBTITLE}}</p>
          </div>
        </div>
      </section>

      <!-- CINEMATIC with ken-burns + vignette + anticipate headline -->
      <section class="slide scene-cinematic dark" data-slide="2" data-transition-in="dissolve">
        <div class="scene-bg anim" data-anim="kenburns" data-t-rel="0" data-dur="14" data-zoom="0.15"
             style="background-image:url('{{SLIDE2_IMAGE}}');"></div>
        <div class="scene-bg-veil"></div>
        <div class="scene-vignette"></div>
        <div class="scene-content">
          <span class="scene-tag anim" data-anim="fadeIn" data-t-rel="0.3" data-dur="0.6">{{SLIDE2_TAG}}</span>
          <h2 class="scene-headline anim" data-anim="anticipate" data-t-rel="0.8" data-dur="1.4">{{SLIDE2_HEADLINE}}</h2>
          <p class="scene-body anim" data-anim="wordReveal" data-t-rel="2.4" data-dur="2.5">{{SLIDE2_BODY}}</p>
        </div>
      </section>

      <!-- LIST with cascading slideInLeft + signature ease -->
      <section class="slide" data-slide="3" data-transition-in="wipe">
        <div class="camera">
          <div class="list-wrap">
            <h2 class="list-title anim" data-anim="fadeUp" data-t-rel="0.2" data-dur="0.9">{{LIST_TITLE}}</h2>
            <ul class="list-items">
              <li class="anim" data-anim="slideInLeft" data-t-rel="1.3" data-dur="0.7"><span class="num">01</span><span>{{LIST_ITEM_1}}</span></li>
              <li class="anim" data-anim="slideInLeft" data-t-rel="2.2" data-dur="0.7"><span class="num">02</span><span>{{LIST_ITEM_2}}</span></li>
              <li class="anim" data-anim="slideInLeft" data-t-rel="3.1" data-dur="0.7"><span class="num">03</span><span>{{LIST_ITEM_3}}</span></li>
              <li class="anim" data-anim="slideInLeft" data-t-rel="4.0" data-dur="0.7"><span class="num">04</span><span>{{LIST_ITEM_4}}</span></li>
            </ul>
          </div>
        </div>
      </section>

      <!-- STAT with overshoot counter + glow accent -->
      <section class="slide" data-slide="4" data-transition-in="flash">
        <div class="stat-wrap">
          <div class="stat-number anim" data-anim="counter"
               data-t-rel="0.4" data-dur="2.0"
               data-to="{{STAT_NUMBER}}" data-suffix="{{STAT_SUFFIX}}">0</div>
          <p class="stat-caption anim" data-anim="fadeUp" data-t-rel="2.6" data-dur="1.0">{{STAT_CAPTION}}</p>
        </div>
      </section>

      <!-- DIAGRAM with path-draw + motion-path circle -->
      <section class="slide" data-slide="5" data-transition-in="dissolve">
        <div class="diagram-wrap">
          <h2 class="diagram-title anim" data-anim="fadeUp" data-t-rel="0.2" data-dur="0.8">{{DIAGRAM_TITLE}}</h2>
          <svg class="diagram-svg" viewBox="0 0 1200 500">
            <path id="diagPath" class="draw anim"
                  data-anim="pathdraw" data-t-rel="1.2" data-dur="2.4"
                  d="M 100 380 Q 600 60, 1100 380" />
            <circle class="anim" data-anim="motionPath"
                    data-t-rel="3.7" data-dur="2.0"
                    data-path="#diagPath"
                    r="14" fill="#3CA8E8" />
          </svg>
        </div>
      </section>

      <!-- CTA with spring entrance + pulsing glow -->
      <section class="slide" data-slide="6" data-transition-in="whipPan">
        <div class="cta-wrap">
          <h2 class="cta-title anim" data-anim="spring" data-t-rel="0.3" data-dur="1.4">{{CTA_TITLE}}</h2>
          <p class="cta-body anim" data-anim="fadeUp" data-t-rel="1.8" data-dur="1.0">{{CTA_BODY}}</p>
          <span class="cta-pill anim" data-anim="glow" data-t-rel="3.0" data-dur="4.0">{{CTA_PILL}}</span>
        </div>
      </section>

    </div>
  </div>

  <!-- Scene transition overlay -->
  <div class="transition-overlay" id="transitionOverlay"></div>

  <!-- Play controls -->
  <div class="play-controls" id="playControls">
    <button id="jumpBtn" aria-label="Jump to slide" title="Jump to slide (J)">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
    </button>
    <button id="resetBtn" aria-label="Reset to start" title="Reset (R)">
      <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
    </button>
    <button id="playBtn" aria-label="Play / Pause" title="Play / Pause (Space)">
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4l13 8L7 20z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
    </button>
  </div>
  <div class="play-progress" id="playProgress"></div>
  <div class="jump-menu" id="jumpMenu" role="menu" aria-label="Jump to slide"></div>

  <audio id="voAudio" preload="metadata" src="{{AUDIO_SRC}}"></audio>

  <script>
  /* =============================================================
     STORYBOARD ENGINE — animator edition
  ============================================================= */

  const TIMINGS = [
    { time:  0.0, slide: 1 },
    { time:  8.0, slide: 2 },
    { time: 20.0, slide: 3 },
    { time: 36.0, slide: 4 },
    { time: 50.0, slide: 5 },
    { time: 65.0, slide: 6 }
  ];
  const SLIDE_LABELS = [
    '{{LABEL_1}}', '{{LABEL_2}}', '{{LABEL_3}}',
    '{{LABEL_4}}', '{{LABEL_5}}', '{{LABEL_6}}'
  ];
  // Word-sync map (optional). Populate from ElevenLabs word-timestamp JSON.
  // Each entry maps an absolute audio time to a CSS selector to "hit" (a quick
  // class toggle the engine flashes for the configured duration).
  // Example: { time: 12.34, sel: '#bigWord', hit: 'pulse' }
  const WORD_HITS = [];
  const FALLBACK_DURATION = 75;

  // Hash of the file's TIMINGS as initially loaded — used to detect when the
  // source has changed (e.g., from re-running aaf_to_timings.py) so a stale
  // localStorage calibration doesn't silently override new cues.
  const INITIAL_TIMINGS_HASH = TIMINGS.map(t => t.slide + ':' + t.time.toFixed(2)).join(',');

  /* ============================================================
     EASINGS
  ============================================================ */
  const easeLinear      = p => p;
  const easeOutCubic    = p => 1 - Math.pow(1 - p, 3);
  const easeInOutCubic  = p => p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
  const easeOutQuint    = p => 1 - Math.pow(1 - p, 5);
  const easeOutBack     = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p-1, 3) + c1 * Math.pow(p-1, 2); };
  const easeOutElastic  = p => {
    const c4 = (2 * Math.PI) / 3;
    return p === 0 ? 0 : p === 1 ? 1 : Math.pow(2, -10*p) * Math.sin((p*10 - 0.75) * c4) + 1;
  };
  const easeOutBounce   = p => {
    const n1 = 7.5625, d1 = 2.75;
    if (p < 1/d1) return n1*p*p;
    if (p < 2/d1) return n1*(p -= 1.5/d1)*p + 0.75;
    if (p < 2.5/d1) return n1*(p -= 2.25/d1)*p + 0.9375;
    return n1*(p -= 2.625/d1)*p + 0.984375;
  };

  /* ============================================================
     PRESETS — ~36 animations, audio-clock driven
  ============================================================ */
  const PRESETS = {

    /* === Basics === */
    fadeIn: { dur: 0.8, apply: (el, p) => { el.style.opacity = easeOutCubic(p); } },
    fadeOut: { dur: 0.8, apply: (el, p) => { el.style.opacity = 1 - easeOutCubic(p); } },
    fadeUp: { dur: 1.0, apply: (el, p) => {
      const e = easeOutCubic(p);
      el.style.opacity = e; el.style.transform = `translateY(${(1-e)*40}px)`;
    }},
    fadeDown: { dur: 1.0, apply: (el, p) => {
      const e = easeOutCubic(p);
      el.style.opacity = e; el.style.transform = `translateY(${(1-e)*-40}px)`;
    }},
    slideInLeft:  { dur: 1.0, apply: (el, p) => { const e = easeOutCubic(p); el.style.opacity = e; el.style.transform = `translateX(${(1-e)*-120}px)`; } },
    slideInRight: { dur: 1.0, apply: (el, p) => { const e = easeOutCubic(p); el.style.opacity = e; el.style.transform = `translateX(${(1-e)*120}px)`;  } },
    scaleIn:      { dur: 1.0, apply: (el, p) => { const e = easeOutCubic(p); el.style.opacity = e; el.style.transform = `scale(${0.85 + 0.15*e})`; } },
    crossfade:    { dur: 1.2, apply: (el, p) => { const out = el.dataset.out === '1'; el.style.opacity = out ? (1-p) : p; } },

    /* === Physics / 12 principles === */
    /* Anticipation: small backward then forward (squash & stretch ish) */
    anticipate: { dur: 1.2, apply: (el, p) => {
      let x;
      if (p < 0.25) { x = -8 * (p / 0.25); }                 // pull back
      else { const q = (p - 0.25) / 0.75; x = -8 + (8 + 100) * easeOutBack(q); } // release forward
      el.style.opacity = Math.min(1, p * 3);
      el.style.transform = `translateX(${-x}px)`;
    }},
    /* Overshoot: target+overshoot+settle */
    overshoot: { dur: 1.0, apply: (el, p) => {
      el.style.opacity = easeOutCubic(p);
      el.style.transform = `translateY(${(1 - easeOutBack(p)) * 30}px)`;
    }},
    /* Spring: elastic settle */
    spring: { dur: 1.2, apply: (el, p) => {
      el.style.opacity = Math.min(1, p * 2);
      const s = 0.7 + 0.3 * easeOutElastic(p);
      el.style.transform = `scale(${s})`;
    }},
    /* Bounce: drops in and settles */
    bounce: { dur: 1.2, apply: (el, p) => {
      el.style.opacity = Math.min(1, p * 2);
      el.style.transform = `translateY(${(1 - easeOutBounce(p)) * -120}px)`;
    }},
    /* Wobble: brief oscillation */
    wobble: { dur: 0.9, apply: (el, p) => {
      el.style.opacity = 1;
      const phase = Math.sin(p * Math.PI * 4) * (1 - p);
      el.style.transform = `rotate(${phase * 4}deg)`;
    }},
    /* Shake: impact accent */
    shake: { dur: 0.5, apply: (el, p) => {
      el.style.opacity = 1;
      const phase = Math.sin(p * Math.PI * 10) * (1 - p);
      el.style.transform = `translateX(${phase * 12}px)`;
    }},
    /* Squash: y-compress + x-stretch, then return */
    squash: { dur: 0.6, apply: (el, p) => {
      el.style.opacity = 1;
      const phase = Math.sin(p * Math.PI);
      el.style.transform = `scale(${1 + phase*0.18}, ${1 - phase*0.22})`;
    }},
    /* Pulse: gentle scale beat */
    pulse: { dur: 0.9, apply: (el, p) => {
      el.style.opacity = 1;
      el.style.transform = `scale(${1 + 0.08 * Math.sin(p * Math.PI)})`;
    }},

    /* === Text === */
    typewriter: { dur: 1.5, apply: (el, p) => {
      if (!el.dataset.fullText) el.dataset.fullText = el.textContent;
      const txt = el.dataset.fullText;
      const n = Math.floor(txt.length * easeOutCubic(p));
      el.textContent = txt.slice(0, n); el.style.opacity = 1;
    }},
    /* Word-by-word reveal (better than typewriter for narration sync) */
    wordReveal: { dur: 1.8, apply: (el, p) => {
      if (!el.dataset.fullText) {
        el.dataset.fullText = el.textContent;
        const words = el.dataset.fullText.split(/\s+/);
        el.innerHTML = words.map((w, i) => `<span class="wr-w" data-i="${i}" style="opacity:0">${w}</span>`).join(' ');
        el.dataset.wordCount = words.length;
      }
      el.style.opacity = 1;
      const n = parseInt(el.dataset.wordCount, 10);
      const e = easeOutCubic(p);
      const shown = Math.floor(n * e);
      el.querySelectorAll('.wr-w').forEach((w, i) => {
        w.style.opacity = i < shown ? 1 : 0;
      });
    }},
    /* Tracking: letter-spacing tightens from wide to normal */
    tracking: { dur: 1.2, apply: (el, p) => {
      const e = easeOutCubic(p);
      el.style.opacity = e;
      el.style.letterSpacing = `${(1-e) * 0.2}em`;
    }},
    /* Gradient sweep across text fill (use with .gradient-fill class) */
    gradientSweep: { dur: 2.0, apply: (el, p) => {
      el.style.opacity = Math.min(1, p * 3);
      el.style.backgroundPosition = `${100 - p * 100}% 50%`;
    }},
    /* Split reveal: two halves part vertically */
    splitReveal: { dur: 1.2, apply: (el, p) => {
      const e = easeInOutCubic(p);
      el.style.opacity = 1;
      el.style.clipPath = `inset(${(1-e)*50}% 0 ${(1-e)*50}% 0)`;
    }},

    /* === Numbers === */
    counter: { dur: 1.8, apply: (el, p) => {
      const to = parseFloat(el.dataset.to) || 0;
      const decimals = parseInt(el.dataset.decimals || '0', 10);
      const suffix = el.dataset.suffix || '';
      const val = to * easeOutQuint(p);
      el.textContent = val.toLocaleString(undefined,
        { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix;
      el.style.opacity = 1;
    }},

    /* === Camera / framing === */
    /* Ken Burns: slow zoom + drift on a background-image */
    kenburns: { dur: 10, apply: (el, p) => {
      const zoom = parseFloat(el.dataset.zoom || '0.1');
      const dx = parseFloat(el.dataset.dx || '2');
      const dy = parseFloat(el.dataset.dy || '-2');
      el.style.opacity = 1;
      el.style.transform = `scale(${1 + zoom*p}) translate(${p*dx}%, ${p*dy}%)`;
    }},
    /* Camera zoom into a focal point (apply to .camera wrapper) */
    cameraZoom: { dur: 2.5, apply: (el, p) => {
      const to = parseFloat(el.dataset.scale || '1.5');
      const ox = parseFloat(el.dataset.ox || '50');
      const oy = parseFloat(el.dataset.oy || '50');
      const e = easeInOutCubic(p);
      el.style.opacity = 1;
      el.style.transformOrigin = `${ox}% ${oy}%`;
      el.style.transform = `scale(${1 + (to - 1) * e})`;
    }},
    /* Camera pan (lateral) */
    cameraPan: { dur: 3.0, apply: (el, p) => {
      const dx = parseFloat(el.dataset.dx || '0');
      const dy = parseFloat(el.dataset.dy || '0');
      const e = easeInOutCubic(p);
      el.style.opacity = 1;
      el.style.transform = `translate(${e*dx}px, ${e*dy}px)`;
    }},
    /* Focus pull: blur fades out */
    focusBlur: { dur: 1.4, apply: (el, p) => {
      const e = easeOutCubic(p);
      el.style.opacity = Math.min(1, p * 3);
      el.style.filter = `blur(${(1-e) * 14}px)`;
    }},
    /* Parallax: slow vertical drift */
    parallax: { dur: 8, apply: (el, p) => {
      const range = parseFloat(el.dataset.range || '40');
      el.style.opacity = 1; el.style.transform = `translateY(${(p-0.5)*range}px)`;
    }},

    /* === Decoration / atmosphere === */
    /* Glow pulse — box-shadow halo */
    glow: { dur: 1.6, apply: (el, p) => {
      el.style.opacity = 1;
      const intensity = 0.5 + 0.5 * Math.sin(p * Math.PI * 2);
      el.style.boxShadow = `0 0 ${30 + intensity * 60}px rgba(60, 168, 232, ${0.3 + intensity * 0.5})`;
    }},
    /* Flicker — neon style */
    flicker: { dur: 1.0, apply: (el, p) => {
      const cycles = 6;
      const phase = (p * cycles) % 1;
      // Random-ish flicker pattern
      const on = phase > 0.15 && phase < 0.5 ? 0 : 1;
      el.style.opacity = on ? Math.min(1, p * 2) : 0.15;
    }},
    /* Highlight — yellow marker sweeps under text */
    highlight: { dur: 0.8, apply: (el, p) => {
      const e = easeOutCubic(p);
      el.style.opacity = 1;
      el.style.backgroundImage = `linear-gradient(90deg, #FFE066 ${e*100}%, transparent ${e*100}%)`;
      el.style.backgroundRepeat = 'no-repeat';
      el.style.backgroundSize = '100% 38%';
      el.style.backgroundPosition = '0 88%';
    }},
    /* Particles: drift child .p elements (expects pre-laid-out SVG circles) */
    particles: { dur: 8, apply: (el, p) => {
      el.style.opacity = 1;
      const ps = el.querySelectorAll('.p');
      ps.forEach((node, i) => {
        const seed = (i * 9301 + 49297) % 233280 / 233280;
        const drift = Math.sin(p * Math.PI * 2 + seed * 6.28) * 40;
        const dy = -p * 200 - seed * 100;
        node.setAttribute('transform', `translate(${drift}, ${dy})`);
        node.style.opacity = Math.sin(p * Math.PI) * 0.8;
      });
    }},
    /* Confetti burst: child .c elements explode outward */
    confetti: { dur: 1.5, apply: (el, p) => {
      el.style.opacity = 1;
      const cs = el.querySelectorAll('.c');
      const e = easeOutCubic(p);
      cs.forEach((node, i) => {
        const angle = (i / cs.length) * Math.PI * 2;
        const dist = e * 320 + (i % 3) * 40;
        const x = Math.cos(angle) * dist;
        const y = Math.sin(angle) * dist - e * 80;
        const rot = e * 540 * ((i % 2) ? 1 : -1);
        node.setAttribute('transform', `translate(${x}, ${y}) rotate(${rot})`);
        node.style.opacity = 1 - p * 0.4;
      });
    }},
    /* Rays: radiating lines from center, scale out */
    rays: { dur: 1.4, apply: (el, p) => {
      el.style.opacity = Math.sin(p * Math.PI);
      const e = easeOutCubic(p);
      el.style.transform = `scale(${0.4 + e * 1.4}) rotate(${p * 30}deg)`;
    }},

    /* === Reveal / mask === */
    reveal: { dur: 1.2, apply: (el, p) => {
      const e = easeInOutCubic(p);
      el.style.clipPath = `inset(0 ${(1-e)*100}% 0 0)`; el.style.opacity = 1;
    }},
    revealUp: { dur: 1.2, apply: (el, p) => {
      const e = easeInOutCubic(p);
      el.style.clipPath = `inset(${(1-e)*100}% 0 0 0)`; el.style.opacity = 1;
    }},
    irisIn: { dur: 1.4, apply: (el, p) => {
      const e = easeInOutCubic(p);
      el.style.opacity = 1;
      el.style.clipPath = `circle(${e * 100}% at 50% 50%)`;
    }},

    /* === SVG / vector === */
    /* Path-draw: stroke-dashoffset sweep */
    pathdraw: { dur: 2.0, apply: (el, p) => {
      if (!el.dataset.len) { try { el.dataset.len = el.getTotalLength(); } catch(e) { el.dataset.len = 1000; } }
      const len = parseFloat(el.dataset.len);
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len * (1 - easeInOutCubic(p));
      el.style.opacity = 1;
    }},
    /* Morph: interpolate between two SVG `d` values */
    morph: { dur: 1.4, apply: (el, p) => {
      // Expects data-from and data-to: full d-strings with identical command structure.
      // For real morphing across arbitrary paths use Flubber; this is a simple lerp
      // that works when the two paths have matching command counts.
      if (!el.dataset.morphInit) {
        el.dataset.morphInit = '1';
        el.dataset.fromNums = (el.dataset.from || '').match(/-?\d+\.?\d*/g)?.join(',') || '';
        el.dataset.toNums   = (el.dataset.to   || '').match(/-?\d+\.?\d*/g)?.join(',') || '';
        el.dataset.template = (el.dataset.from || '').replace(/-?\d+\.?\d*/g, '@');
      }
      const from = el.dataset.fromNums.split(',').map(parseFloat);
      const to   = el.dataset.toNums.split(',').map(parseFloat);
      const tpl  = el.dataset.template;
      const e = easeInOutCubic(p);
      let i = 0;
      const d = tpl.replace(/@/g, () => {
        const v = from[i] + (to[i] - from[i]) * e;
        i++;
        return v.toFixed(2);
      });
      el.setAttribute('d', d);
      el.style.opacity = 1;
    }},
    /* Motion path: element follows an SVG path's coordinates */
    motionPath: { dur: 2.0, apply: (el, p) => {
      const sel = el.dataset.path;
      const path = sel ? document.querySelector(sel) : null;
      if (!path) return;
      if (!el.dataset.pathLen) { try { el.dataset.pathLen = path.getTotalLength(); } catch(e) { el.dataset.pathLen = 0; } }
      const len = parseFloat(el.dataset.pathLen);
      if (!len) return;
      const pt = path.getPointAtLength(len * easeInOutCubic(p));
      // Apply via transform so it works for <circle> and <g> alike
      if (el.tagName === 'circle' || el.tagName === 'ellipse') {
        el.setAttribute('cx', pt.x);
        el.setAttribute('cy', pt.y);
      } else {
        el.setAttribute('transform', `translate(${pt.x}, ${pt.y})`);
      }
      el.style.opacity = 1;
    }},

    /* === Lottie (loaded lazily; see bottom of script) === */
    lottie: { dur: 0, apply: () => { /* handled out of band by initLottie */ } }
  };

  /* ============================================================
     LOTTIE LAZY INIT — only fetched if a [data-anim="lottie"] exists
  ============================================================ */
  const LOTTIE_INSTANCES = [];
  function initLottieInstances() {
    document.querySelectorAll('[data-anim="lottie"]').forEach(el => {
      const url = el.dataset.src;
      if (!url || !window.lottie) return;
      const inst = window.lottie.loadAnimation({
        container: el, renderer: 'svg', loop: false, autoplay: false, path: url
      });
      LOTTIE_INSTANCES.push({ el, inst, t: parseFloat(el.dataset.tAbs || 0), dur: parseFloat(el.dataset.dur || 3) });
    });
  }
  function syncLottie(time) {
    for (const L of LOTTIE_INSTANCES) {
      if (!L.inst.isLoaded) continue;
      const total = L.inst.totalFrames || L.inst.getDuration(true);
      const fps = L.inst.frameRate || 30;
      if (time < L.t) { L.inst.goToAndStop(0, true); L.el.style.opacity = 0; continue; }
      if (time > L.t + L.dur) { L.inst.goToAndStop(total - 1, true); L.el.style.opacity = 1; continue; }
      L.el.style.opacity = 1;
      const p = (time - L.t) / L.dur;
      const frame = Math.min(total - 1, Math.max(0, p * total));
      L.inst.goToAndStop(frame, true);
    }
  }

  /* ============================================================
     SCENE TRANSITIONS
  ============================================================ */
  const TRANSITION_OVERLAY = document.getElementById('transitionOverlay');

  function playTransition(kind) {
    if (!kind || kind === 'cut') return;
    const ol = TRANSITION_OVERLAY;
    ol.className = 'transition-overlay ' + kind;
    // Restart animation
    ol.style.animation = 'none';
    void ol.offsetWidth;
    const dur = 0.55;
    if (kind === 'dissolve' || kind === 'flash') {
      ol.style.opacity = '1';
      ol.animate(
        [ { opacity: 1 }, { opacity: 0 } ],
        { duration: dur * 1000, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
      );
    } else if (kind === 'whipPan') {
      ol.style.opacity = '1';
      ol.animate(
        [ { transform: 'translateX(-100%)', opacity: 1 }, { transform: 'translateX(100%)', opacity: 1 } ],
        { duration: dur * 1000, easing: 'cubic-bezier(0.7, 0, 0.3, 1)', fill: 'forwards' }
      ).onfinish = () => { ol.style.opacity = '0'; };
    } else if (kind === 'wipe') {
      ol.style.opacity = '1';
      ol.animate(
        [ { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)', offset: 0.5 }, { clipPath: 'inset(0 0 0 100%)' } ],
        { duration: dur * 1000, easing: 'cubic-bezier(0.7, 0, 0.3, 1)', fill: 'forwards' }
      ).onfinish = () => { ol.style.opacity = '0'; };
    } else if (kind === 'blocks') {
      ol.style.opacity = '1';
      ol.animate(
        [ { opacity: 1, transform: 'scaleY(1)' }, { opacity: 1, transform: 'scaleY(0.05)' }, { opacity: 0, transform: 'scaleY(0.05)' } ],
        { duration: dur * 1000, easing: 'cubic-bezier(0.85, 0, 0.15, 1)', fill: 'forwards' }
      );
    }
  }

  /* ============================================================
     BOILERPLATE
  ============================================================ */
  const deck = document.getElementById('deck');
  const playControls = document.getElementById('playControls');
  const playBtn      = document.getElementById('playBtn');
  const resetBtn     = document.getElementById('resetBtn');
  const jumpBtn      = document.getElementById('jumpBtn');
  const jumpMenu     = document.getElementById('jumpMenu');
  const progress     = document.getElementById('playProgress');
  const voAudio      = document.getElementById('voAudio');
  const allSlides    = [...document.querySelectorAll('.slide')];
  let currentSlide   = 0;
  let rafId          = 0;

  /* === Synthetic clock — lets the deck preview before the MP3 exists.
     Activates when the audio errors or has no source after 1.2s. ====== */
  let useSyntheticClock = false;
  let syntheticTime = 0;
  let syntheticPlaying = false;
  let syntheticPlayStart = 0;
  function getTime() {
    if (useSyntheticClock) {
      return syntheticPlaying ? syntheticTime + (performance.now() - syntheticPlayStart) / 1000 : syntheticTime;
    }
    return voAudio.currentTime;
  }
  function setTime(t) {
    if (useSyntheticClock) {
      syntheticTime = t;
      if (syntheticPlaying) syntheticPlayStart = performance.now();
    } else {
      voAudio.currentTime = t;
    }
  }
  function isPlaying() {
    return useSyntheticClock ? syntheticPlaying : (!voAudio.paused && !voAudio.ended);
  }
  function activateSynthetic(reason) {
    if (useSyntheticClock) return;
    useSyntheticClock = true;
    const badge = document.createElement('div');
    badge.textContent = 'PREVIEW (no audio)';
    badge.style.cssText = 'position:fixed;top:12px;left:12px;z-index:9999;font:600 10px/1 system-ui,sans-serif;letter-spacing:.14em;background:rgba(60,168,232,.92);color:#fff;padding:6px 10px;border-radius:6px;opacity:.85';
    document.body.appendChild(badge);
    console.info('Storyboard: synthetic clock active (' + reason + ')');
  }
  voAudio.addEventListener('error', () => activateSynthetic('audio error'));
  setTimeout(() => { if (voAudio.readyState === 0 && !voAudio.duration) activateSynthetic('no audio source loaded'); }, 1200);

  /* === CALIBRATION MODE — live retiming
     T enter/exit · M mark current time · Bksp undo · A apply · E export · Esc exit
     Bracket keys ([ ]) or , . nudge current slide's cue by 0.25s during normal play
     Auto-saves to localStorage and auto-loads on next visit.
  ============================================================ */
  const CALIB = {
    active: false, cues: [], badge: null,
    key() { return 'storyboard-calib::' + location.pathname; },
    start() { this.active = true; this.cues = [0]; this.ensureBadge(); this.update(); },
    exitMode() { this.active = false; if (this.badge) { this.badge.remove(); this.badge = null; } },
    mark(t) {
      if (!this.active || this.cues.length >= TIMINGS.length) return;
      if (t <= this.cues[this.cues.length - 1]) t = this.cues[this.cues.length - 1] + 0.1;
      this.cues.push(parseFloat(t.toFixed(2))); this.update();
    },
    undo() { if (this.active && this.cues.length > 1) { this.cues.pop(); this.update(); } },
    apply() {
      const n = Math.min(this.cues.length, TIMINGS.length);
      for (let i = 0; i < n; i++) TIMINGS[i].time = this.cues[i];
      ANIMS.length = 0; resolveTimingsToSlideElements();
      jumpMenu.innerHTML = ''; buildJumpMenu();
      applyAnimsAt(getTime());
      try {
        localStorage.setItem(this.key(), JSON.stringify({
          sourceHash: INITIAL_TIMINGS_HASH,
          cues: this.cues
        }));
      } catch (e) {}
      this.flash('APPLIED · ' + n + ' cues');
    },
    exportCues() {
      const txt = 'const TIMINGS = [\n' +
        this.cues.map((t, i) => `  { time: ${t.toFixed(2).padStart(7)}, slide: ${(i+1).toString().padStart(2)} }`).join(',\n') +
        '\n];';
      console.log(txt);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(txt).then(
          () => this.flash('COPIED — paste into storyboard.html'),
          () => this.flash('EXPORT logged to console')
        );
      } else this.flash('EXPORT logged to console');
    },
    loadSaved() {
      try {
        const saved = localStorage.getItem(this.key()); if (!saved) return false;
        const parsed = JSON.parse(saved);
        if (!parsed || !parsed.sourceHash || !Array.isArray(parsed.cues)) {
          console.info('Storyboard: discarding old-format calibration (no source hash).');
          localStorage.removeItem(this.key());
          return false;
        }
        if (parsed.sourceHash !== INITIAL_TIMINGS_HASH) {
          console.info('Storyboard: file TIMINGS changed — discarding stale calibration.');
          localStorage.removeItem(this.key());
          return false;
        }
        const cues = parsed.cues; if (!cues.length) return false;
        this.cues = cues;
        const n = Math.min(cues.length, TIMINGS.length);
        for (let i = 0; i < n; i++) TIMINGS[i].time = cues[i];
        ANIMS.length = 0; resolveTimingsToSlideElements();
        console.info('Storyboard: loaded saved calibration (' + n + ' cues)');
        return true;
      } catch (e) { return false; }
    },
    clearSaved() { try { localStorage.removeItem(this.key()); } catch (e) {} },
    ensureBadge() {
      if (this.badge) return;
      const b = document.createElement('div');
      b.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;font:600 12px/1.5 ui-monospace,monospace;letter-spacing:.06em;background:rgba(60,168,232,.95);color:#fff;padding:10px 18px;border-radius:8px;text-align:center;min-width:420px;box-shadow:0 4px 16px rgba(0,0,0,0.35);';
      document.body.appendChild(b); this.badge = b;
    },
    update() {
      if (!this.badge) return;
      const n = this.cues.length, total = TIMINGS.length;
      const label = n >= total
        ? 'ALL CAPTURED — [A]pply · [E]xport · [Esc] exit'
        : 'CALIBRATION · captured ' + n + '/' + total + ' · next: slide ' + (n+1);
      this.badge.innerHTML = label + '<br><span style="opacity:.85;font-weight:400;">[M] mark · [Bksp] undo · [A]pply · [E]xport · [Esc] exit</span>';
    },
    flash(msg) {
      if (!this.badge) {
        const t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;font:600 12px/1.4 ui-monospace,monospace;letter-spacing:.06em;background:rgba(10,132,120,.95);color:#fff;padding:10px 18px;border-radius:8px;';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
      } else {
        this.badge.innerHTML = '<strong>' + msg + '</strong>';
        setTimeout(() => { if (this.badge) this.update(); }, 1500);
      }
    }
  };

  function scaleToFit() {
    const sx = window.innerWidth  / 1920;
    const sy = window.innerHeight / 1080;
    const s  = Math.min(sx, sy);
    deck.style.transform = `translate3d(0,0,0) scale(${s})`;
  }
  scaleToFit();
  window.addEventListener('resize', scaleToFit);

  const io = new IntersectionObserver(
    entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-visible'); }),
    { root: deck, threshold: 0.35 }
  );
  document.querySelectorAll('.slide').forEach(s => io.observe(s));
  document.querySelector('.slide')?.classList.add('is-visible');

  /* ============================================================
     ANIMATION SCHEDULING
  ============================================================ */
  const ANIMS = [];

  function resolveTimingsToSlideElements() {
    const cueFor = {};
    TIMINGS.forEach(t => { cueFor[t.slide] = t.time; });

    document.querySelectorAll('.anim').forEach(el => {
      const slideEl = el.closest('.slide');
      const slideN = slideEl ? parseInt(slideEl.dataset.slide || '0', 10) : 0;
      const cue = cueFor[slideN] ?? 0;

      let t;
      if (el.dataset.t !== undefined) t = parseFloat(el.dataset.t);
      else if (el.dataset.tRel !== undefined) t = cue + parseFloat(el.dataset.tRel);
      else t = cue;

      const presetName = el.dataset.anim || 'fadeIn';
      const preset = PRESETS[presetName] || PRESETS.fadeIn;
      const dur = el.dataset.dur !== undefined ? parseFloat(el.dataset.dur) : preset.dur;

      ANIMS.push({ el, t, dur, preset, name: presetName });
      // Lottie elements get their absolute time stored for the lottie sync loop
      if (presetName === 'lottie') el.dataset.tAbs = String(t);
    });
  }

  function applyAnimsAt(time) {
    for (const a of ANIMS) {
      if (a.name === 'lottie') continue; // handled by syncLottie
      if (time < a.t) {
        a.el.style.opacity = 0;
        a.el.classList.remove('anim-played');
      } else if (time >= a.t && time <= a.t + a.dur) {
        const p = (time - a.t) / a.dur;
        a.preset.apply(a.el, Math.max(0, Math.min(1, p)));
      } else if (!a.el.classList.contains('anim-played')) {
        a.preset.apply(a.el, 1);
        a.el.classList.add('anim-played');
      }
    }
    syncLottie(time);
  }

  /* ============================================================
     WORD HITS — quick visual accents on specific words
     WORD_HITS = [{ time, sel, hit: 'pulse' | 'shake' | 'flash' | 'highlight' }]
     Each is a 0.4s flash applied via runtime preset call.
  ============================================================ */
  const wordHitState = new WeakMap();
  function applyWordHits(time) {
    for (const h of WORD_HITS) {
      if (time >= h.time && time <= h.time + 0.6) {
        const el = document.querySelector(h.sel);
        if (!el) continue;
        if (wordHitState.get(el) === h.time) continue; // already firing
        wordHitState.set(el, h.time);
        const preset = PRESETS[h.hit] || PRESETS.pulse;
        const start = performance.now();
        const dur = 600;
        function frame() {
          const p = Math.min(1, (performance.now() - start) / dur);
          preset.apply(el, p);
          if (p < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
    }
  }

  /* ============================================================
     UI
  ============================================================ */
  function buildJumpMenu() {
    const frag = document.createDocumentFragment();
    TIMINGS.forEach((cue, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.slide = cue.slide;
      const mm = Math.floor(cue.time / 60).toString().padStart(2, '0');
      const ss = Math.floor(cue.time % 60).toString().padStart(2, '0');
      btn.innerHTML =
        '<span class="jm-num">' + String(cue.slide).padStart(2, '0') + '</span>' +
        '<span class="jm-title">' + (SLIDE_LABELS[idx] || ('Slide ' + cue.slide)) + '</span>' +
        '<span class="jm-num" style="min-width:38px;text-align:right;opacity:.6;">' + mm + ':' + ss + '</span>';
      frag.appendChild(btn);
    });
    jumpMenu.appendChild(frag);
  }
  function updateActiveMenu(n) {
    jumpMenu.querySelectorAll('button').forEach(b => {
      b.classList.toggle('is-active', parseInt(b.dataset.slide, 10) === n);
    });
  }
  function getDuration() {
    if (useSyntheticClock) return FALLBACK_DURATION;
    return (voAudio && voAudio.duration && isFinite(voAudio.duration))
      ? voAudio.duration : FALLBACK_DURATION;
  }
  function jumpToSlide(n) {
    const cue = TIMINGS.find(t => t.slide === n);
    if (!cue) return;
    setTime(cue.time + 0.01);
    const slide = allSlides[n - 1];
    if (slide) deck.scrollTo({ top: slide.offsetTop, behavior: 'smooth' });
    currentSlide = n;
    updateActiveMenu(n);
    progress.style.width = (cue.time / getDuration() * 100) + '%';
    progress.classList.add('is-active');
    applyAnimsAt(getTime());
  }

  jumpBtn.addEventListener('click', (e) => { e.stopPropagation(); jumpMenu.classList.toggle('is-open'); });
  jumpMenu.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-slide]'); if (!btn) return;
    jumpToSlide(parseInt(btn.dataset.slide, 10));
    jumpMenu.classList.remove('is-open');
  });
  document.addEventListener('click', (e) => {
    if (!jumpMenu.contains(e.target) && e.target !== jumpBtn) jumpMenu.classList.remove('is-open');
  });

  /* ============================================================
     MAIN TICK
  ============================================================ */
  function tick() {
    const elapsed = getTime();

    let target = TIMINGS[0].slide;
    for (const t of TIMINGS) { if (elapsed >= t.time) target = t.slide; else break; }
    if (target !== currentSlide) {
      const arriving = allSlides[target - 1];
      const trans = arriving?.dataset.transitionIn || 'cut';
      playTransition(trans);
      currentSlide = target;
      if (arriving) deck.scrollTo({ top: arriving.offsetTop, behavior: 'smooth' });
      updateActiveMenu(currentSlide);
    }
    applyAnimsAt(elapsed);
    applyWordHits(elapsed);
    progress.style.width = Math.min(elapsed / getDuration() * 100, 100) + '%';

    if (useSyntheticClock && elapsed >= getDuration()) {
      syntheticPlaying = false;
      syntheticTime = getDuration();
      playControls.classList.remove('is-playing');
      return;
    }
    if (isPlaying()) rafId = requestAnimationFrame(tick);
  }

  function play() {
    if (useSyntheticClock) {
      syntheticPlayStart = performance.now();
      syntheticPlaying = true;
      playControls.classList.add('is-playing');
      progress.classList.add('is-active');
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(tick);
      return;
    }
    voAudio.play().then(() => {
      playControls.classList.add('is-playing');
      progress.classList.add('is-active');
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(tick);
    }).catch(err => console.warn('Audio play blocked:', err));
  }
  function pause() {
    if (useSyntheticClock) {
      syntheticTime = getTime();
      syntheticPlaying = false;
      playControls.classList.remove('is-playing');
      cancelAnimationFrame(rafId);
      return;
    }
    voAudio.pause();
    playControls.classList.remove('is-playing');
    cancelAnimationFrame(rafId);
  }
  function reset() {
    pause();
    setTime(0);
    currentSlide = 0;
    progress.style.width = '0%';
    progress.classList.remove('is-active');
    deck.scrollTo({ top: 0, behavior: 'smooth' });
    ANIMS.forEach(a => { a.el.classList.remove('anim-played'); a.el.style.opacity = 0; });
    applyAnimsAt(0);
  }

  voAudio.addEventListener('play',  () => playControls.classList.add('is-playing'));
  voAudio.addEventListener('pause', () => playControls.classList.remove('is-playing'));
  voAudio.addEventListener('ended', () => { playControls.classList.remove('is-playing'); progress.style.width = '100%'; });
  voAudio.addEventListener('timeupdate', () => { if (voAudio.paused && !useSyntheticClock) applyAnimsAt(voAudio.currentTime); });
  voAudio.addEventListener('seeked',     () => { if (!useSyntheticClock) applyAnimsAt(voAudio.currentTime); });

  playBtn.addEventListener('click', () => (isPlaying() ? pause() : play()));
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea, [contenteditable]')) return;
    // Calibration shortcuts
    if (e.code === 'KeyT') { e.preventDefault(); CALIB.active ? CALIB.exitMode() : CALIB.start(); return; }
    if (CALIB.active) {
      if (e.code === 'KeyM')      { e.preventDefault(); CALIB.mark(getTime()); return; }
      if (e.code === 'Backspace') { e.preventDefault(); CALIB.undo(); return; }
      if (e.code === 'KeyA')      { e.preventDefault(); CALIB.apply(); return; }
      if (e.code === 'KeyE')      { e.preventDefault(); CALIB.exportCues(); return; }
      if (e.code === 'Escape')    { e.preventDefault(); CALIB.exitMode(); return; }
    }
    if (e.code === 'Space')       { e.preventDefault(); isPlaying() ? pause() : play(); }
    else if (e.code === 'KeyR' || e.code === 'Home') { e.preventDefault(); reset(); }
    else if (e.code === 'KeyJ')   { e.preventDefault(); jumpMenu.classList.toggle('is-open'); }
    else if (e.code === 'Escape') { jumpMenu.classList.remove('is-open'); }
    else if (e.code === 'ArrowRight') {
      e.preventDefault();
      const now = getTime();
      const next = TIMINGS.find(t => t.time > now + 0.1);
      if (next) jumpToSlide(next.slide);
    }
    else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      const now = getTime();
      const past = [...TIMINGS].reverse().find(t => t.time < now - 0.5);
      if (past) jumpToSlide(past.slide);
    }
    else if (e.code === 'BracketLeft' || e.code === 'Comma') {
      e.preventDefault();
      const cue = TIMINGS.find(t => t.slide === currentSlide);
      if (cue && cue.slide > 1) {
        cue.time = Math.max(0, cue.time - 0.25);
        ANIMS.length = 0; resolveTimingsToSlideElements();
        jumpMenu.innerHTML = ''; buildJumpMenu();
        applyAnimsAt(getTime());
        CALIB.flash('Slide ' + cue.slide + ' cue: ' + cue.time.toFixed(2) + 's');
      }
    }
    else if (e.code === 'BracketRight' || e.code === 'Period') {
      e.preventDefault();
      const cue = TIMINGS.find(t => t.slide === currentSlide);
      if (cue && cue.slide > 1) {
        cue.time = cue.time + 0.25;
        ANIMS.length = 0; resolveTimingsToSlideElements();
        jumpMenu.innerHTML = ''; buildJumpMenu();
        applyAnimsAt(getTime());
        CALIB.flash('Slide ' + cue.slide + ' cue: ' + cue.time.toFixed(2) + 's');
      }
    }
  });

  // Preview / playthrough hook
  window.STORYBOARD = {
    cues: TIMINGS, labels: SLIDE_LABELS,
    seek(t) {
      setTime(t);
      let target = TIMINGS[0].slide;
      for (const cue of TIMINGS) { if (t >= cue.time) target = cue.slide; else break; }
      if (target !== currentSlide) {
        currentSlide = target;
        const slide = allSlides[currentSlide - 1];
        if (slide) deck.scrollTo({ top: slide.offsetTop, behavior: 'auto' });
        updateActiveMenu(currentSlide);
      }
      applyAnimsAt(t);
    },
    currentSlide: () => currentSlide,
    play, pause, reset,
    presets: Object.keys(PRESETS),
    isSynthetic: () => useSyntheticClock
  };

  /* Lazy-load lottie if any element wants it */
  if (document.querySelector('[data-anim="lottie"]')) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js';
    s.onload = () => { initLottieInstances(); applyAnimsAt(getTime()); };
    document.head.appendChild(s);
  }

  buildJumpMenu();
  resolveTimingsToSlideElements();
  if (CALIB.loadSaved()) {
    jumpMenu.innerHTML = '';
    buildJumpMenu();
    CALIB.flash('Loaded saved calibration');
  }
  applyAnimsAt(0);

  // Console-friendly handle for calibration tooling
  window.STORYBOARD.calib = CALIB;
  </script>

</body>
</html>
