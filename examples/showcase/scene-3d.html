<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storyboard — Real 3D (WebGL)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05060a;font-family:'Space Grotesk',system-ui,sans-serif}
.stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.deck{width:1920px;height:1080px;transform-origin:center;overflow:hidden;backface-visibility:hidden}
:root{--bg:#05060a;--ink:#F4F6FF;--ink-soft:#9aa3c0;--accent:#7C5CFF;--accent2:#19E3B1;--accent3:#FF5C8A;--gold:#FFD166}
.slide{width:1920px;height:1080px;position:relative;overflow:hidden;background:radial-gradient(120% 120% at 50% 18%,#11142a,#05060a);color:var(--ink);display:flex;align-items:center;justify-content:center;contain:layout paint}
.anim{opacity:0;will-change:transform,opacity,filter}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(124,92,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(124,92,255,.06) 1px,transparent 1px);background-size:64px 64px;z-index:0}
.gradient-fill{background:linear-gradient(110deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.scene{position:relative;z-index:2}
.center{position:relative;z-index:3;text-align:center}
.mega{font-size:150px;line-height:.96;font-weight:700;letter-spacing:-.04em}
.big{font-size:108px;line-height:1.0;font-weight:700;letter-spacing:-.03em}
.h2{font-size:78px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.sub{font-size:32px;line-height:1.4;color:var(--ink-soft);margin-top:22px;max-width:760px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.4em;text-transform:uppercase;color:var(--accent2)}
.cta-pill{display:inline-block;margin-top:46px;padding:30px 60px;border-radius:18px;font-size:38px;font-weight:700;color:#06070c;background:var(--accent2)}
.transition-overlay{position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:0}
.transition-overlay.dissolve{background:#05060a}.transition-overlay.flash{background:#fff}
.transition-overlay.whipPan{background:linear-gradient(90deg,transparent,#05060a 50%,transparent);transform:translateX(-100%)}
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck">

  <!-- 1 hero knot -->
  <section class="slide" data-slide="1" data-transition-in="cut">
    <div class="grid-bg"></div>
    <div class="scene anim" data-anim="scene3d" data-scene="knot" data-t-rel="0" data-dur="9999" style="position:absolute;width:880px;height:880px;left:50%;top:48%;transform:translate(-50%,-50%)"></div>
    <div class="center" style="position:absolute;top:90px;left:0;right:0">
      <p class="eyebrow anim" data-anim="fadeUp" data-t-rel="0.2" data-dur="0.7">webgl · three.js</p>
      <h1 class="mega gradient-fill anim" data-anim="letterSpring" data-t-rel="0.8" data-dur="1.6" style="margin-top:18px">Real 3D.</h1>
    </div>
  </section>

  <!-- 2 orbit + camera move -->
  <section class="slide" data-slide="2" data-transition-in="crossDissolve">
    <div class="grid-bg"></div>
    <div style="position:absolute;left:130px;top:50%;transform:translateY(-50%);max-width:620px;z-index:3">
      <h2 class="h2 anim" data-anim="fadeUp" data-t-rel="0.2" data-dur="0.8">Meshes, lights<br>&amp; a moving camera.</h2>
      <p class="sub anim" data-anim="wordReveal" data-t-rel="1.1" data-dur="1.6" style="margin-left:0">Every frame is driven by the same audio clock — scrub the VO and the scene scrubs with it.</p>
    </div>
    <div class="scene anim" data-anim="scene3d" data-scene="orbit" data-t-rel="0" data-dur="9999" style="position:absolute;width:860px;height:860px;right:120px;top:50%;transform:translateY(-50%)"></div>
  </section>

  <!-- 3 materials cube -->
  <section class="slide" data-slide="3" data-transition-in="zoomIn">
    <div class="grid-bg"></div>
    <div class="scene anim" data-anim="scene3d" data-scene="cube" data-t-rel="0" data-dur="9999" style="position:absolute;width:820px;height:820px;left:50%;top:52%;transform:translate(-50%,-50%)"></div>
    <div class="center" style="position:absolute;top:80px;left:0;right:0">
      <h2 class="h2 anim" data-anim="fadeUp" data-t-rel="0.2" data-dur="0.8">Materials that catch the light.</h2>
    </div>
  </section>

  <!-- 4 CTA -->
  <section class="slide" data-slide="4" data-transition-in="whipPan">
    <div class="grid-bg"></div>
    <div class="scene anim" data-anim="scene3d" data-scene="gem" data-t-rel="0" data-dur="9999" style="position:absolute;width:760px;height:760px;left:50%;top:58%;transform:translate(-50%,-50%)"></div>
    <div class="center" style="position:absolute;top:120px;left:0;right:0">
      <h1 class="big gradient-fill anim" data-anim="letterSpring" data-t-rel="0.3" data-dur="1.5">Now in 3D.</h1>
      <p class="sub anim" data-anim="fadeUp" data-t-rel="1.8" data-dur="0.7" style="margin-left:auto;margin-right:auto">github.com/gRAYESS123/storyboard-claude</p>
      <span class="cta-pill anim" data-anim="spring" data-t-rel="2.4" data-dur="0.9" data-loop="breathe" data-loop-amp="2" data-loop-period="2.4">/storyboard</span>
    </div>
  </section>

</div></div>
<div class="transition-overlay" id="transitionOverlay"></div>
<audio id="voAudio" preload="metadata"></audio>

<script src="three.min.js"></script>
<script>
/* Clock-synced 3D scenes. api = {THREE,scene,camera,renderer,el,w,h}; return update(t,p). */
window.SB_SCENES = {
  knot: function(api){ var T=api.THREE, s=api.scene, cam=api.camera;
    s.add(new T.AmbientLight(0xffffff,0.5));
    var d=new T.DirectionalLight(0xffffff,1.0); d.position.set(4,5,6); s.add(d);
    var d2=new T.DirectionalLight(0x19E3B1,0.55); d2.position.set(-5,-3,2); s.add(d2);
    var m=new T.Mesh(new T.TorusKnotGeometry(1.25,0.4,110,16), new T.MeshStandardMaterial({color:0x7C5CFF,roughness:0.28,metalness:0.4}));
    s.add(m); cam.position.set(0,0,4.4);
    return function(t,p){ m.rotation.x=t*0.42; m.rotation.y=t*0.6; };
  },
  orbit: function(api){ var T=api.THREE, s=api.scene, cam=api.camera;
    s.add(new T.AmbientLight(0xffffff,0.5));
    var d=new T.DirectionalLight(0xffffff,1.0); d.position.set(3,4,6); s.add(d);
    var core=new T.Mesh(new T.IcosahedronGeometry(1.15,0), new T.MeshStandardMaterial({color:0xFFD166,roughness:0.4,metalness:0.2,flatShading:true})); s.add(core);
    var a=new T.Mesh(new T.SphereGeometry(0.42,28,18), new T.MeshStandardMaterial({color:0x19E3B1,roughness:0.25,metalness:0.3})); s.add(a);
    var b=new T.Mesh(new T.SphereGeometry(0.30,24,16), new T.MeshStandardMaterial({color:0xFF5C8A,roughness:0.25,metalness:0.3})); s.add(b);
    cam.position.set(0,0,6.2);
    return function(t,p){ core.rotation.y=t*0.5; core.rotation.x=t*0.18;
      a.position.set(Math.cos(t*1.1)*2.7, Math.sin(t*0.7)*0.7, Math.sin(t*1.1)*2.7);
      b.position.set(Math.cos(t*0.8+2)*3.4, Math.sin(t*1.3)*0.9, Math.sin(t*0.8+2)*3.4);
      cam.position.x=Math.sin(t*0.25)*1.8; cam.position.y=Math.sin(t*0.18)*0.6; cam.lookAt(0,0,0);
    };
  },
  cube: function(api){ var T=api.THREE, s=api.scene, cam=api.camera;
    s.add(new T.AmbientLight(0xffffff,0.55));
    var d=new T.DirectionalLight(0xffffff,0.95); d.position.set(4,6,6); s.add(d);
    var d2=new T.DirectionalLight(0x7C5CFF,0.5); d2.position.set(-4,-2,3); s.add(d2);
    var cols=[0x7C5CFF,0x19E3B1,0xFF5C8A,0xFFD166,0x7C5CFF,0x19E3B1];
    var mats=cols.map(function(c){ return new T.MeshStandardMaterial({color:c,roughness:0.32,metalness:0.25}); });
    var m=new T.Mesh(new T.BoxGeometry(2,2,2), mats); s.add(m); cam.position.set(0,0,4.6);
    return function(t,p){ m.rotation.x=t*0.5; m.rotation.y=t*0.68; };
  },
  gem: function(api){ var T=api.THREE, s=api.scene, cam=api.camera;
    s.add(new T.AmbientLight(0xffffff,0.5));
    var d=new T.DirectionalLight(0xffffff,1.0); d.position.set(3,5,6); s.add(d);
    var d2=new T.DirectionalLight(0xFF5C8A,0.6); d2.position.set(-4,-3,2); s.add(d2);
    var m=new T.Mesh(new T.OctahedronGeometry(1.5,0), new T.MeshStandardMaterial({color:0x19E3B1,roughness:0.18,metalness:0.55,flatShading:true}));
    s.add(m); cam.position.set(0,0,4.6);
    return function(t,p){ m.rotation.y=t*0.7; m.rotation.z=Math.sin(t*0.5)*0.3; };
  }
};
const TIMINGS = [ { time:0.0, slide:1 }, { time:6.0, slide:2 }, { time:12.0, slide:3 }, { time:18.0, slide:4 } ];
const SLIDE_LABELS = ['Hero knot','Orbit','Materials','CTA gem'];
</script>
<script src="storyboard-engine.js"></script>
<script>Storyboard.init({ timings: TIMINGS, labels: SLIDE_LABELS, fallbackDuration: 25 });</script>
</body>
</html>
