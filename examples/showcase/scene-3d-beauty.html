<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storyboard — Beautiful 3D (universe · cars · worlds)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#03040a;font-family:'Space Grotesk',system-ui,sans-serif}
.stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.deck{width:1920px;height:1080px;transform-origin:center;overflow:hidden;backface-visibility:hidden}
:root{--ink:#F4F6FF;--ink-soft:#aeb6d6;--accent:#7C5CFF;--accent2:#19E3B1;--accent3:#FF5C8A;--gold:#FFD166}
.slide{width:1920px;height:1080px;position:relative;overflow:hidden;background:#03040a;color:var(--ink);contain:layout paint}
.anim{opacity:0;will-change:transform,opacity,filter}
.bleed3d{position:absolute;inset:0;z-index:1}
.gradient-fill{background:linear-gradient(110deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.t-wrap{position:absolute;z-index:3}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent2)}
.mega{font-size:150px;line-height:.95;font-weight:700;letter-spacing:-.04em;text-shadow:0 6px 40px rgba(0,0,0,.6)}
.big{font-size:120px;line-height:1.0;font-weight:700;letter-spacing:-.03em;text-shadow:0 6px 40px rgba(0,0,0,.6)}
.sub{font-size:34px;line-height:1.4;color:var(--ink-soft);margin-top:22px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.cta-pill{display:inline-block;margin-top:46px;padding:30px 60px;border-radius:18px;font-size:38px;font-weight:700;color:#06070c;background:var(--accent2)}
.transition-overlay{position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:0}
.transition-overlay.dissolve{background:#03040a}.transition-overlay.flash{background:#fff}
.transition-overlay.whipPan{background:linear-gradient(90deg,transparent,#03040a 50%,transparent);transform:translateX(-100%)}
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck">

  <!-- 1 galaxy -->
  <section class="slide" data-slide="1" data-transition-in="cut">
    <div class="bleed3d anim" data-anim="scene3d" data-scene="galaxy" data-res="0.62" data-t-rel="0" data-dur="9999"></div>
    <div class="t-wrap" style="top:96px;left:0;right:0;text-align:center">
      <p class="eyebrow anim" data-anim="fadeUp" data-t-rel="0.3" data-dur="0.8">webgl · 14,000 stars</p>
      <h1 class="mega gradient-fill anim" data-anim="letterSpring" data-t-rel="1.0" data-dur="1.6" style="margin-top:16px">A whole<br>universe.</h1>
    </div>
  </section>

  <!-- 2 synthwave highway / cars -->
  <section class="slide" data-slide="2" data-transition-in="crossDissolve">
    <div class="bleed3d anim" data-anim="scene3d" data-scene="highway" data-res="0.6" data-t-rel="0" data-dur="9999"></div>
    <div class="t-wrap" style="top:90px;left:120px">
      <h1 class="big anim" data-anim="fadeUp" data-t-rel="0.3" data-dur="0.9">Neon nights.</h1>
      <p class="sub anim" data-anim="wordReveal" data-t-rel="1.3" data-dur="1.6" style="max-width:680px">Streaming headlights, a scrolling grid, a sunset that never sets — all on the audio clock.</p>
    </div>
  </section>

  <!-- 3 planet -->
  <section class="slide" data-slide="3" data-transition-in="crossDissolve">
    <div class="bleed3d anim" data-anim="scene3d" data-scene="planet" data-res="0.64" data-t-rel="0" data-dur="9999"></div>
    <div class="t-wrap" style="bottom:120px;left:0;right:0;text-align:center">
      <h1 class="big gradient-fill anim" data-anim="letterSpring" data-t-rel="0.4" data-dur="1.5">Worlds away.</h1>
    </div>
  </section>

  <!-- 4 warp CTA -->
  <section class="slide" data-slide="4" data-transition-in="flash">
    <div class="bleed3d anim" data-anim="scene3d" data-scene="warp" data-res="0.62" data-t-rel="0" data-dur="9999"></div>
    <div class="t-wrap" style="top:50%;left:0;right:0;text-align:center;transform:translateY(-50%)">
      <h1 class="mega gradient-fill anim" data-anim="letterSpring" data-t-rel="0.4" data-dur="1.5">Storyboard,<br>in 3D.</h1>
      <p class="sub anim" data-anim="fadeUp" data-t-rel="2.0" data-dur="0.7" style="text-align:center">github.com/gRAYESS123/storyboard-claude</p>
      <span class="cta-pill anim" data-anim="spring" data-t-rel="2.5" data-dur="0.9" data-loop="breathe" data-loop-amp="2" data-loop-period="2.4">/storyboard</span>
    </div>
  </section>

</div></div>
<div class="transition-overlay" id="transitionOverlay"></div>
<audio id="voAudio" preload="metadata"></audio>

<script src="three.min.js"></script>
<script>
window.SB_SCENES = {
  /* ---- spiral galaxy ---- */
  galaxy: function(api){ var T=api.THREE, s=api.scene, cam=api.camera;
    var COUNT=14000, ARMS=5, RAD=10, SPIN=0.85;
    var pos=new Float32Array(COUNT*3), col=new Float32Array(COUNT*3);
    var cIn=new T.Color(0xFFE9A8), cOut=new T.Color(0x7C5CFF);
    for(var i=0;i<COUNT;i++){ var r=Math.pow(Math.random(),1.6)*RAD;
      var branch=(i%ARMS)/ARMS*Math.PI*2, spin=r*SPIN;
      var rx=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*r*0.32;
      var ry=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*r*0.12;
      var rz=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*r*0.32;
      pos[i*3]=Math.cos(branch+spin)*r+rx; pos[i*3+1]=ry; pos[i*3+2]=Math.sin(branch+spin)*r+rz;
      var c=cIn.clone().lerp(cOut, Math.min(1,r/RAD)); col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; }
    var g=new T.BufferGeometry(); g.setAttribute('position',new T.BufferAttribute(pos,3)); g.setAttribute('color',new T.BufferAttribute(col,3));
    var pts=new T.Points(g, new T.PointsMaterial({size:0.06,sizeAttenuation:true,depthWrite:false,blending:T.AdditiveBlending,vertexColors:true,transparent:true,opacity:0.9})); s.add(pts);
    var core=new T.Mesh(new T.SphereGeometry(0.45,18,18), new T.MeshBasicMaterial({color:0xFFF6D8})); s.add(core);
    var glow=new T.Mesh(new T.SphereGeometry(1.3,20,20), new T.MeshBasicMaterial({color:0xFFD166,transparent:true,opacity:0.18,blending:T.AdditiveBlending})); s.add(glow);
    cam.position.set(0,5,11);
    return function(t,p){ pts.rotation.y=t*0.07; var a=t*0.09; cam.position.set(Math.sin(a)*11, 4.5+Math.sin(t*0.13)*1.6, Math.cos(a)*11); cam.lookAt(0,0,0); };
  },
  /* ---- synthwave highway with cars ---- */
  highway: function(api){ var T=api.THREE, s=api.scene, cam=api.camera;
    s.background=new T.Color(0x190a2f); s.fog=new T.Fog(0x190a2f, 12, 64);
    var sun=new T.Mesh(new T.CircleGeometry(8,48), new T.MeshBasicMaterial({color:0xFF7AC0})); sun.position.set(0,7,-52); s.add(sun);
    var sun2=new T.Mesh(new T.CircleGeometry(8.6,48), new T.MeshBasicMaterial({color:0xFFB36B,transparent:true,opacity:0.35,blending:T.AdditiveBlending})); sun2.position.set(0,7,-53); s.add(sun2);
    var grid=new T.GridHelper(180,90,0x19E3B1,0x6a39c9); grid.position.y=0.01; s.add(grid);
    var cars=[]; var lanesR=[1.6,3.2,4.8], lanesL=[-1.6,-3.2,-4.8];
    function mkCar(x,head){ var col=head?0xFFF3D0:0xFF3B6B; var m=new T.Mesh(new T.BoxGeometry(0.5,0.22,1.0), new T.MeshBasicMaterial({color:col}));
      m.position.set(x,0.22,head?(10-Math.random()*70):(-60+Math.random()*70)); m.userData={head:head,sp:14+Math.random()*10}; s.add(m); cars.push(m); }
    for(var i=0;i<10;i++){ mkCar(lanesL[i%3], true); }   // headlights coming toward
    for(var j=0;j<12;j++){ mkCar(lanesR[j%3], false); }  // taillights heading away
    for(var b=0;b<18;b++){ var hgt=4+Math.random()*9; var bx=new T.Mesh(new T.BoxGeometry(2.4+Math.random()*2, hgt, 2.4), new T.MeshBasicMaterial({color:0x0c0720}));
      bx.position.set((Math.random()-0.5)*90, hgt/2, -34-Math.random()*16); s.add(bx); }
    cam.position.set(0,2.6,11);
    return function(t,p){ grid.position.z=(t*9)%2;
      cars.forEach(function(m){ var d=m.userData; m.position.z += (d.head?1:-1)*d.sp*0.016;
        if(m.position.z>11){ m.position.z=-62; } if(m.position.z<-62){ m.position.z=11; } });
      cam.position.x=Math.sin(t*0.16)*1.4; cam.lookAt(0,1.8,-30); };
  },
  /* ---- ringed planet in space ---- */
  planet: function(api){ var T=api.THREE, s=api.scene, cam=api.camera;
    var SC=2600, sp=new Float32Array(SC*3); for(var i=0;i<SC;i++){ var rr=26+Math.random()*44, th=Math.random()*6.283, ph=Math.acos(2*Math.random()-1);
      sp[i*3]=rr*Math.sin(ph)*Math.cos(th); sp[i*3+1]=rr*Math.sin(ph)*Math.sin(th); sp[i*3+2]=rr*Math.cos(ph); }
    var sg=new T.BufferGeometry(); sg.setAttribute('position',new T.BufferAttribute(sp,3));
    var stars=new T.Points(sg, new T.PointsMaterial({color:0xffffff,size:0.16,sizeAttenuation:true,transparent:true,opacity:0.9,depthWrite:false})); s.add(stars);
    var sun=new T.DirectionalLight(0xfff0d4,1.5); sun.position.set(6,3,5); s.add(sun); s.add(new T.AmbientLight(0x223a66,0.45));
    var planet=new T.Mesh(new T.SphereGeometry(2.5,48,48), new T.MeshStandardMaterial({color:0x2f6fb6,roughness:0.85,metalness:0.05})); s.add(planet);
    var atmo=new T.Mesh(new T.SphereGeometry(2.78,32,32), new T.MeshBasicMaterial({color:0x5ab0ff,transparent:true,opacity:0.18,blending:T.AdditiveBlending,side:T.BackSide})); s.add(atmo);
    var ring=new T.Mesh(new T.RingGeometry(3.3,4.8,72), new T.MeshBasicMaterial({color:0xFFD166,transparent:true,opacity:0.5,side:T.DoubleSide})); ring.rotation.x=Math.PI*0.46; s.add(ring);
    cam.position.set(0,1.4,8.5);
    return function(t,p){ planet.rotation.y=t*0.12; ring.rotation.z=t*0.04; stars.rotation.y=t*0.008;
      var a=t*0.08; cam.position.set(Math.sin(a)*8.5, 1.4+Math.sin(t*0.12)*1.1, Math.cos(a)*8.5); cam.lookAt(0,0,0); };
  },
  /* ---- warp starfield ---- */
  warp: function(api){ var T=api.THREE, s=api.scene, cam=api.camera;
    var N=2600, sp=new Float32Array(N*3); for(var i=0;i<N;i++){ sp[i*3]=(Math.random()-0.5)*40; sp[i*3+1]=(Math.random()-0.5)*24; sp[i*3+2]=-Math.random()*70; }
    var g=new T.BufferGeometry(); g.setAttribute('position',new T.BufferAttribute(sp,3));
    var pts=new T.Points(g, new T.PointsMaterial({color:0xCfe0ff,size:0.13,sizeAttenuation:true,transparent:true,opacity:0.95,depthWrite:false,blending:T.AdditiveBlending})); s.add(pts);
    cam.position.set(0,0,6); cam.lookAt(0,0,-1);
    return function(t,p){ var a=g.attributes.position.array;
      for(var i=0;i<N;i++){ a[i*3+2]+=0.55; if(a[i*3+2]>7){ a[i*3+2]=-70; a[i*3]=(Math.random()-0.5)*40; a[i*3+1]=(Math.random()-0.5)*24; } }
      g.attributes.position.needsUpdate=true; pts.rotation.z=t*0.05; };
  }
};
const TIMINGS = [ { time:0.0, slide:1 }, { time:7.0, slide:2 }, { time:14.0, slide:3 }, { time:20.0, slide:4 } ];
const SLIDE_LABELS = ['Galaxy','Neon highway','Planet','Warp CTA'];
</script>
<script src="storyboard-engine.js"></script>
<script>Storyboard.init({ timings: TIMINGS, labels: SLIDE_LABELS, fallbackDuration: 26 });</script>
</body>
</html>
