<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storyboard — Cosmic Zoom (universe · Earth · neon city)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02030a;font-family:'Space Grotesk',system-ui,sans-serif}
.stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.deck{width:1920px;height:1080px;transform-origin:center;overflow:hidden;backface-visibility:hidden}
:root{--ink:#F4F6FF;--ink-soft:#cfd5f2;--accent:#7C5CFF;--accent2:#19E3B1;--accent3:#FF2D9B;--gold:#FFD166}
.slide{width:1920px;height:1080px;position:relative;overflow:hidden;background:#02030a;color:var(--ink);contain:layout paint}
.anim{opacity:0;will-change:transform,opacity,filter}
.bleed3d{position:absolute;inset:0;z-index:1}
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none}
.flash{position:absolute;inset:0;z-index:30;background:#eaf1ff;pointer-events:none}
.gradient-fill{background:linear-gradient(110deg,#fff,#e3e9ff 45%,#bcc8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.neon-fill{background:linear-gradient(110deg,#fff,#7afcff 40%,#ff6ad5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.t-wrap{position:absolute;z-index:3}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent2)}
.mega{font-size:160px;line-height:.93;font-weight:700;letter-spacing:-.04em;text-shadow:0 10px 60px rgba(0,0,0,.92)}
.big{font-size:128px;line-height:1.0;font-weight:700;letter-spacing:-.03em;text-shadow:0 10px 60px rgba(0,0,0,.92)}
.sub{font-size:34px;line-height:1.4;color:var(--ink-soft);margin-top:22px;text-shadow:0 2px 30px rgba(0,0,0,.95)}
.cta-pill{display:inline-block;margin-top:46px;padding:30px 60px;border-radius:18px;font-size:38px;font-weight:700;color:#06070c;background:var(--accent2);box-shadow:0 0 70px rgba(25,227,177,.6)}
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck">

  <section class="slide" data-slide="1" data-transition-in="cut">
    <div class="bleed3d anim" data-anim="scene3d" data-scene="universe" data-res="0.75" data-bloom="0.6,0.6,0.45" data-exposure="0.95" data-fov="58" data-t-rel="0" data-dur="9999"></div>
    <div class="scrim" style="background:radial-gradient(120% 85% at 50% 16%,transparent 42%,rgba(2,3,10,.55))"></div>
    <div class="t-wrap" style="top:90px;left:0;right:0;text-align:center">
      <p class="eyebrow anim" data-anim="fadeUp" data-t-rel="0.3" data-dur="0.8">webgl · gpu render · cosmic zoom</p>
      <h1 class="mega gradient-fill anim" data-anim="letterSpring" data-t-rel="0.9" data-dur="1.5" style="margin-top:16px">A whole<br>universe.</h1>
    </div>
  </section>

  <section class="slide" data-slide="2" data-transition-in="flash">
    <div class="bleed3d anim" data-anim="scene3d" data-scene="earth" data-res="0.75" data-bloom="0.42,0.55,0.6" data-exposure="0.98" data-fov="48" data-t-rel="0" data-dur="9999"></div>
    <div class="flash anim" data-anim="flashOut" data-t-rel="0" data-dur="0.45"></div>
    <div class="scrim" style="background:radial-gradient(110% 90% at 50% 50%,transparent 56%,rgba(2,3,10,.5))"></div>
    <div class="t-wrap" style="bottom:108px;left:0;right:0;text-align:center">
      <h1 class="big gradient-fill anim" data-anim="letterSpring" data-t-rel="0.7" data-dur="1.4">A living world.</h1>
    </div>
  </section>

  <section class="slide" data-slide="3" data-transition-in="flash">
    <div class="bleed3d anim" data-anim="scene3d" data-scene="city" data-res="0.7" data-bloom="0.5,0.62,0.5" data-dof="46,0.0008,0.005" data-exposure="1.02" data-fov="64" data-t-rel="0" data-dur="9999"></div>
    <div class="flash anim" data-anim="flashOut" data-t-rel="0" data-dur="0.45"></div>
    <div class="scrim" style="background:linear-gradient(100deg,rgba(2,3,10,.74),rgba(2,3,10,.3) 32%,transparent 54%),linear-gradient(180deg,rgba(2,3,10,.4),transparent 26%,transparent 72%,rgba(2,3,10,.55))"></div>
    <div class="t-wrap" style="top:84px;left:120px">
      <h1 class="big neon-fill anim" data-anim="fadeUp" data-t-rel="0.4" data-dur="0.9">Down to the<br>street.</h1>
      <p class="sub anim" data-anim="wordReveal" data-t-rel="1.7" data-dur="1.6" style="max-width:720px">From the galaxy to a million neon windows — one continuous shot, in real 3D.</p>
    </div>
  </section>

  <section class="slide" data-slide="4" data-transition-in="flash">
    <div class="bleed3d anim" data-anim="scene3d" data-scene="cityCta" data-res="0.7" data-bloom="0.5,0.62,0.5" data-dof="32,0.001,0.007" data-exposure="1.02" data-fov="58" data-t-rel="0" data-dur="9999"></div>
    <div class="flash anim" data-anim="flashOut" data-t-rel="0" data-dur="0.45"></div>
    <div class="scrim" style="background:radial-gradient(120% 100% at 50% 60%,transparent 38%,rgba(2,3,10,.66))"></div>
    <div class="t-wrap" style="top:50%;left:0;right:0;text-align:center;transform:translateY(-50%)">
      <h1 class="mega neon-fill anim" data-anim="letterSpring" data-t-rel="0.5" data-dur="1.4">Storyboard,<br>in 3D.</h1>
      <p class="sub anim" data-anim="fadeUp" data-t-rel="1.9" data-dur="0.7" style="text-align:center">github.com/gRAYESS123/storyboard-claude</p>
      <span class="cta-pill anim" data-anim="spring" data-t-rel="2.4" data-dur="0.9" data-loop="breathe" data-loop-amp="2" data-loop-period="2.4">/storyboard</span>
    </div>
  </section>

</div></div>
<div class="transition-overlay" id="transitionOverlay"></div>
<audio id="voAudio" preload="metadata"></audio>

<script src="three.min.js"></script>
<script src="three-bloom.js"></script>
<script src="three-extras.js"></script>
<script>
/* ---------------- shared helpers ---------------- */
function softTex(T){ var c=document.createElement('canvas'); c.width=c.height=128; var x=c.getContext('2d');
  var g=x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,.8)'); g.addColorStop(0.55,'rgba(255,255,255,.22)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128); return new T.CanvasTexture(c); }
function sprite(T,tex,color,sx,sy){ var s=new T.Sprite(new T.SpriteMaterial({map:tex,color:color,transparent:true,depthWrite:false,blending:T.AdditiveBlending})); s.scale.set(sx,sy||sx,1); return s; }
function vgrad(T,stops){ var c=document.createElement('canvas'); c.width=8; c.height=256; var x=c.getContext('2d'); var g=x.createLinearGradient(0,0,0,256); stops.forEach(function(s){ g.addColorStop(s[0],s[1]); }); x.fillStyle=g; x.fillRect(0,0,8,256); return new T.CanvasTexture(c); }
function envGrad(T,r,top,bot){ var c=document.createElement('canvas'); c.width=8; c.height=128; var x=c.getContext('2d'); var g=x.createLinearGradient(0,0,0,128); g.addColorStop(0,top); g.addColorStop(1,bot); x.fillStyle=g; x.fillRect(0,0,8,128); var tex=new T.CanvasTexture(c); tex.mapping=T.EquirectangularReflectionMapping; var pm=new T.PMREMGenerator(r); var e=pm.fromEquirectangular(tex).texture; pm.dispose(); tex.dispose(); return e; }
function atmo(T,radius,color,strength){ var m=new T.ShaderMaterial({ uniforms:{ gc:{value:new T.Color(color)}, st:{value:strength} },
    vertexShader:'varying float vI; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vec3 wn=normalize(mat3(modelMatrix)*normal); vec3 vd=normalize(cameraPosition-wp.xyz); vI=pow(1.0-abs(dot(wn,vd)),3.0); gl_Position=projectionMatrix*viewMatrix*wp; }',
    fragmentShader:'varying float vI; uniform vec3 gc; uniform float st; void main(){ gl_FragColor=vec4(gc, vI*st); }',
    transparent:true, blending:T.AdditiveBlending, side:T.BackSide, depthWrite:false });
  return new T.Mesh(new T.SphereGeometry(radius,64,64), m); }
function lerp3(T,a,b,c,t){ var ca=new T.Color(a),cb=new T.Color(b),cc=new T.Color(c); return t<0.5? ca.lerp(cb,t/0.5): cb.lerp(cc,(t-0.5)/0.5); }
function eio(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function eo(t){ return 1-Math.pow(1-t,3); }
function starfield(T,scene,tex,n,rin,rout,col,size,op){ var p=new Float32Array(n*3); for(var i=0;i<n;i++){ var rr=rin+Math.random()*(rout-rin), th=Math.random()*6.283, ph=Math.acos(2*Math.random()-1); p[i*3]=rr*Math.sin(ph)*Math.cos(th); p[i*3+1]=rr*Math.sin(ph)*Math.sin(th); p[i*3+2]=rr*Math.cos(ph); } var g=new T.BufferGeometry(); g.setAttribute('position',new T.BufferAttribute(p,3)); scene.add(new T.Points(g,new T.PointsMaterial({color:col,size:size,map:tex,transparent:true,depthWrite:false,blending:T.AdditiveBlending,opacity:op,sizeAttenuation:true}))); }

/* glass-tower facade (emissiveMap): tall windows, floor-banded lighting, warm/cool. Black = dark glass. */
function facadeCanvas(palette){ var R=256; var c=document.createElement('canvas'); c.width=c.height=R; var x=c.getContext('2d');
  x.fillStyle='#000'; x.fillRect(0,0,R,R);
  var cols=10, rows=22, m=6, gx=2, cw=(R-m*2)/cols, ch=(R-m*2)/rows;
  for(var j=0;j<rows;j++){ var floorLit=Math.random()<0.5; for(var i=0;i<cols;i++){
    var lit = floorLit ? Math.random()<0.8 : Math.random()<0.08; if(!lit) continue;
    var r=Math.random(), a=0.6+Math.random()*0.4;
    if(r<palette[0]) x.fillStyle='rgba(255,198,112,'+a+')';
    else if(r<palette[0]+palette[1]) x.fillStyle='rgba(150,202,255,'+a+')';
    else x.fillStyle='rgba(255,246,224,'+a+')';
    x.fillRect(m+i*cw+gx, m+j*ch+gx, cw-gx*2, ch-gx*2);
  } }
  return c;
}
/* abstract neon billboard: bright bars + border on black (emissive, blooms into a glowing sign) */
function billboardCanvas(){ var W=128,H=192; var c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d');
  x.fillStyle='#050409'; x.fillRect(0,0,W,H);
  var hues=['#ff2d9b','#19e3b1','#36c8ff','#ffd23a','#9d5bff','#ff5e5e','#6aff7a']; var col=hues[(Math.random()*hues.length)|0];
  x.shadowColor=col; x.shadowBlur=9; x.fillStyle=col;
  var n=3+(Math.random()*4|0); for(var k=0;k<n;k++){ var ly=16+k*(H-26)/n, lw=W*(0.42+Math.random()*0.46); x.fillRect((W-lw)/2, ly, lw, 6+Math.random()*8); }
  x.strokeStyle=col; x.lineWidth=4; x.strokeRect(8,8,W-16,H-16);
  return c;
}
/* defined avenue: asphalt + double-yellow centre + dashed lane lines + solid edges (tiles along z) */
function asphaltCanvas(){ var W=160,H=160; var c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d');
  x.fillStyle='#0a0b11'; x.fillRect(0,0,W,H);
  for(var i=0;i<2600;i++){ var v=18+Math.random()*26; x.fillStyle='rgba('+v+','+v+','+(v+6)+',0.5)'; x.fillRect(Math.random()*W,Math.random()*H,1,1); }
  x.fillStyle='#e9c63a'; x.fillRect(W*0.485,0,2.4,H); x.fillRect(W*0.515-2.4,0,2.4,H);          // double yellow centre
  x.fillStyle='#e8ecf5'; for(var d=0;d<H;d+=26){ x.fillRect(W*0.265,d,2.2,15); x.fillRect(W*0.735-2.2,d,2.2,15); } // dashed lanes
  x.fillStyle='#cfd6e6'; x.fillRect(W*0.045,0,2.2,H); x.fillRect(W*0.955-2.2,0,2.2,H);          // solid edges
  return c;
}
function concreteCanvas(){ var W=64,H=64; var c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d'); x.fillStyle='#15161e'; x.fillRect(0,0,W,H);
  for(var i=0;i<500;i++){ var v=24+Math.random()*22; x.fillStyle='rgba('+v+','+v+','+(v+4)+',0.5)'; x.fillRect(Math.random()*W,Math.random()*H,1,1); }
  x.strokeStyle='rgba(0,0,0,0.35)'; x.lineWidth=1; for(var g=0;g<W;g+=16){ x.beginPath(); x.moveTo(g,0); x.lineTo(g,H); x.stroke(); }
  return c;
}

/* ---------------- the shared neon city ---------------- */
var NEON=[0xFF1E8E,0x14F0D0,0x9D5BFF,0x36C8FF,0xFFD23A,0xFF4D5E,0x6AFF7A];
function buildCity(T,s,api,soft){
  s.background=new T.Color(0x05030d); s.fog=new T.Fog(0x140a28, 28, 235);
  var sky=new T.Mesh(new T.PlaneGeometry(900,360), new T.MeshBasicMaterial({map:vgrad(T,[[0,'#040310'],[0.55,'#120b2a'],[0.83,'#321443'],[1,'#5a2547']]),depthWrite:false,fog:false})); sky.position.set(0,56,-190); s.add(sky);
  var moon=sprite(T,soft,0xCFE6FF,7); moon.position.set(-66,72,-186); s.add(moon);
  starfield(T,s,soft,700,130,290,0xcdd8ff,0.5,0.7);
  var key=new T.DirectionalLight(0xa9c4ff,0.5); key.position.set(-30,70,30); s.add(key);
  s.add(new T.HemisphereLight(0x33477e,0x060810,0.42)); s.add(new T.AmbientLight(0x0d1430,0.32));
  var ground=new T.Mesh(new T.PlaneGeometry(900,900), new T.MeshStandardMaterial({color:0x06060d,roughness:0.7,metalness:0.2})); ground.rotation.x=-Math.PI/2; ground.position.y=-0.05; s.add(ground);
  var cc=new T.CanvasTexture(concreteCanvas()); cc.wrapS=cc.wrapT=T.RepeatWrapping; cc.repeat.set(2,42);
  [-7,7].forEach(function(sx){ var sw=new T.Mesh(new T.BoxGeometry(3,0.5,440), new T.MeshStandardMaterial({map:cc,roughness:0.9,metalness:0.05})); sw.position.set(sx,0.25,-52); s.add(sw); });
  var faces=[facadeCanvas([0.82,0.08,0.10]),facadeCanvas([0.55,0.35,0.10]),facadeCanvas([0.45,0.45,0.10])];
  var bbs=[billboardCanvas(),billboardCanvas(),billboardCanvas(),billboardCanvas(),billboardCanvas()];
  var glassRoof=new T.MeshStandardMaterial({color:0x0c0e16,roughness:0.55,metalness:0.5});
  function neonStrip(x,y,z,w,h,col,ry){ var m=new T.Mesh(new T.PlaneGeometry(w,h), new T.MeshBasicMaterial({color:col,transparent:true,opacity:0.95,fog:true,side:T.DoubleSide})); m.position.set(x,y,z); if(ry)m.rotation.y=ry; s.add(m);
    var gl=sprite(T,soft,col,Math.max(w,1.2)*1.1,Math.max(h,1.2)*1.1); gl.position.set(x,y,z+0.08); gl.material.opacity=0.55; s.add(gl); }
  function billboard(x,y,z,sz,ry){ var t=new T.CanvasTexture(bbs[(Math.random()*bbs.length)|0]); var m=new T.Mesh(new T.PlaneGeometry(sz,sz*1.45), new T.MeshBasicMaterial({map:t,transparent:true,fog:true,side:T.DoubleSide,blending:T.AdditiveBlending})); m.position.set(x,y,z); if(ry)m.rotation.y=ry; s.add(m); }
  function building(x,z){ var w=5+Math.random()*6, d=5+Math.random()*6, dc=Math.abs(x), h=(14+Math.pow(Math.random(),1.6)*72)*(dc<40?1:Math.max(0.4,1-(dc-40)/160));
    var cv=faces[(Math.random()*faces.length)|0]; var tx=new T.CanvasTexture(cv); tx.wrapS=tx.wrapT=T.RepeatWrapping;
    tx.repeat.set(Math.max(1,Math.round(w/4)), Math.max(2,Math.round(h/5))); tx.offset.set(Math.random(),Math.random()); tx.anisotropy=8;
    // dark reflective GLASS + emissive lit windows (reflects the baked neon env)
    var mat=new T.MeshStandardMaterial({color:0x0a0e1c,emissive:0xffffff,emissiveMap:tx,emissiveIntensity:0.7+Math.random()*0.6,roughness:0.14+Math.random()*0.12,metalness:0.62,envMapIntensity:0.95});
    var m=new T.Mesh(new T.BoxGeometry(w,h,d), mat); m.position.set(x,h/2,z); s.add(m);
    // varied silhouettes: setback + spire (tall) or rooftop unit (short)
    if(h>46 && Math.random()<0.7){ var w2=w*(0.55+Math.random()*0.2), h2=h*(0.2+Math.random()*0.18); var m2=new T.Mesh(new T.BoxGeometry(w2,h2,d*0.6), mat); m2.position.set(x,h+h2/2,z); s.add(m2);
      if(Math.random()<0.55){ var spH=4+Math.random()*7; var sp=new T.Mesh(new T.CylinderGeometry(0.16,0.32,spH,6), glassRoof); sp.position.set(x,h+h2+spH/2,z); s.add(sp); var bcn=sprite(T,soft,0xFF3344,0.85); bcn.material.opacity=0.9; bcn.position.set(x,h+h2+spH,z); s.add(bcn); } }
    else { var rm=new T.Mesh(new T.BoxGeometry(w*0.45,1.6,d*0.45), glassRoof); rm.position.set(x+(Math.random()-0.5)*w*0.3,h+0.8,z); s.add(rm); }
    var inner = x<0 ? x+d/2+0.06 : x-d/2-0.06; var face = x<0 ? Math.PI/2 : -Math.PI/2; var near=dc<34;
    if(near){
      if(Math.random()<0.45){ var col=NEON[(Math.random()*NEON.length)|0]; neonStrip(inner, h*0.5, z+(Math.random()-0.5)*d*0.6, 0.3, h*0.8, col, face); }
      if(Math.random()<0.5) billboard(inner, h*(0.4+Math.random()*0.35), z+(Math.random()-0.5)*d*0.4, 3+Math.random()*4, face);
      if(Math.random()<0.7){ var c3=NEON[(Math.random()*NEON.length)|0]; neonStrip(inner, 1.8+Math.random()*1.2, z+(Math.random()-0.5)*d*0.5, 2.4+Math.random()*2, 0.7+Math.random()*0.7, c3, face); }
    }
    return h; }
  for(var bx=-130; bx<=130; bx+=10+Math.random()*5){ for(var bz=36; bz>=-200; bz-=10+Math.random()*5){
    if(Math.abs(bx)<8.5) continue; if(Math.random()<0.1) continue;
    building(bx+(Math.random()-0.5)*3.5, bz+(Math.random()-0.5)*3.5); } }
  for(var lz=24; lz>-160; lz-=18){ [-6.5,6.5].forEach(function(lx){ var pole=new T.Mesh(new T.CylinderGeometry(0.09,0.09,7,6), new T.MeshStandardMaterial({color:0x0c0d14,roughness:0.6,metalness:0.6})); pole.position.set(lx,3.5,lz); s.add(pole); var lamp=sprite(T,soft,0xFFE7B0,1.1); lamp.material.opacity=0.72; lamp.position.set(lx-(lx<0?-1:1)*0.5,7,lz); s.add(lamp); }); }
  var cars=[]; function car(head){ var lane=(head?-1:1)*(1.4+Math.random()*2.6); var col=head?0xEAF4FF:0xFF2D55; var len=3+Math.random()*3.5;
    var m=new T.Mesh(new T.BoxGeometry(0.5,0.14,len), new T.MeshBasicMaterial({color:col,fog:true})); m.position.set(lane,0.5,0); s.add(m);
    var gl=sprite(T,soft,col,2.2,1.0); s.add(gl);
    var o={mesh:m,glow:gl,head:head,lane:lane,v:26+Math.random()*22,ph:Math.random()*220,len:len}; cars.push(o); return o; }
  for(var ci=0;ci<28;ci++) car(ci%2===0);
  function updateCars(lt){ cars.forEach(function(o){ var span=200; var z=34 - (((o.ph + lt*o.v*(o.head?1:-0.7))%span)+span)%span;
    o.mesh.position.set(o.lane,0.5,z); o.glow.position.set(o.lane,0.55,z+(o.head?-o.len/2:o.len/2)); }); }
  // bake the lit/neon city into an environment cube so the glass towers reflect it
  try{ var cubeRT=new T.WebGLCubeRenderTarget(256,{format:T.RGBAFormat,generateMipmaps:true,minFilter:T.LinearMipmapLinearFilter}); var cubeCam=new T.CubeCamera(1,1400,cubeRT); cubeCam.position.set(0,24,-46); cubeCam.update(api.renderer,s); s.environment=cubeRT.texture; }catch(e){}
  // REAL wet-road reflections: a planar mirror + a semi-transparent asphalt overlay (lane markings show on top)
  try{ var mirror=new T.Reflector(new T.PlaneGeometry(13,440), {textureWidth:1024,textureHeight:1024,color:0x0a0d12,clipBias:0.003}); mirror.rotation.x=-Math.PI/2; mirror.position.set(0,0.002,-52); s.add(mirror); }catch(e){}
  var aTex=new T.CanvasTexture(asphaltCanvas()); aTex.wrapS=aTex.wrapT=T.RepeatWrapping; aTex.repeat.set(1,30); aTex.anisotropy=8;
  var roadTop=new T.Mesh(new T.PlaneGeometry(13,440), new T.MeshBasicMaterial({map:aTex,transparent:true,opacity:0.58,depthWrite:false,fog:true})); roadTop.rotation.x=-Math.PI/2; roadTop.position.set(0,0.014,-52); s.add(roadTop);
  return { updateCars:updateCars };
}

/* real Earth night-lights: scatter warm dots over land pixels of the albedo (same-origin -> readable) */
var EARTH_ALBEDO=new Image(); EARTH_ALBEDO.src='earth-albedo.jpg';
var EARTH_NORMAL=new Image(); EARTH_NORMAL.src='earth-normal.webp';   // preload (cache) so the loader is instant at scene init
function earthNightCanvas(img){ var W=1024,H=512; var c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,W,H);
  try{ var t=document.createElement('canvas'); t.width=W; t.height=H; var tc=t.getContext('2d'); tc.drawImage(img,0,0,W,H); var d=tc.getImageData(0,0,W,H).data;
    for(var py=0;py<H;py+=2)for(var px=0;px<W;px+=2){ var i=(py*W+px)*4, r=d[i],g=d[i+1],b=d[i+2], bright=r+g+b;
      var land=(r>=b-4||g>=b+6) && bright>60 && !(r>180&&g>180&&b>190);
      if(land && Math.random()<0.11){ x.fillStyle='rgba(255,'+(192+Math.random()*52|0)+','+(110+Math.random()*70|0)+','+(0.5+Math.random()*0.5)+')'; x.fillRect(px,py,1.5,1.5); } } }catch(e){}
  return c; }
window.SB_SCENES = {
  /* ===================== UNIVERSE (dive into the galaxy) ===================== */
  universe: function(api){ var T=api.THREE, s=api.scene, cam=api.camera; s.background=new T.Color(0x04051a);
    var tex=softTex(T), N=46000, RAD=13, ARMS=5, pos=new Float32Array(N*3), col=new Float32Array(N*3);
    for(var i=0;i<N;i++){ var r=Math.pow(Math.random(),1.6)*RAD, br=(i%ARMS)/ARMS*6.2832, sp=r*0.42, spread=(0.05+0.30*(r/RAD));
      pos[i*3]=Math.cos(br+sp)*r + (Math.random()-0.5)*r*spread*2.0; pos[i*3+1]=(Math.random()-0.5)*(0.5+r*0.05); pos[i*3+2]=Math.sin(br+sp)*r + (Math.random()-0.5)*r*spread*2.0;
      var c=lerp3(T,0xFFF1D0,0xFF74C4,0x4A6BFF, Math.min(1,r/RAD)); var b=0.7+Math.random()*0.6; col[i*3]=c.r*b; col[i*3+1]=c.g*b; col[i*3+2]=c.b*b; }
    var g=new T.BufferGeometry(); g.setAttribute('position',new T.BufferAttribute(pos,3)); g.setAttribute('color',new T.BufferAttribute(col,3));
    s.add(new T.Points(g, new T.PointsMaterial({size:0.15,map:tex,vertexColors:true,transparent:true,depthWrite:false,blending:T.AdditiveBlending,sizeAttenuation:true,opacity:0.62})));
    s.add(sprite(T,tex,0xFFE6B0,2.4)); s.add(sprite(T,tex,0xFF9AD8,5.0)); var halo=sprite(T,tex,0x3a2470,9); s.add(halo);
    starfield(T,s,tex,1500,40,90,0x9fb4ff,0.3,0.5);
    var t0=null;
    return function(t){ if(t0===null)t0=t; var lt=t-t0; s.rotation.y=lt*0.15;
      var k=eio(Math.min(1,lt/5.0)); var rad=22-18*k; var ang=-0.6+lt*0.14;
      cam.position.set(Math.sin(ang)*rad, 7-6*k+Math.sin(lt*0.5)*0.5, Math.cos(ang)*rad); cam.lookAt(0,-0.2,0); };
  },

  /* ===================== EARTH (a living world) ===================== */
  earth: function(api){ var T=api.THREE, s=api.scene, cam=api.camera; var soft=softTex(T); s.background=new T.Color(0x03040c);
    var loader=new T.TextureLoader();
    var dayTex=loader.load('earth-albedo.jpg'); if(T.sRGBEncoding) dayTex.encoding=T.sRGBEncoding; dayTex.anisotropy=8;
    var normTex=loader.load('earth-normal.webp'); normTex.anisotropy=8;
    var sun=new T.DirectionalLight(0xfff6e8,2.4); sun.position.set(7,1.6,7); s.add(sun); s.add(new T.HemisphereLight(0x213c64,0x05070e,0.2));
    // real Blue-Marble albedo + terrain normal map; emissive night-lights from the albedo's land
    var emat=new T.MeshStandardMaterial({map:dayTex, normalMap:normTex, normalScale:new T.Vector2(1.5,1.5), roughness:0.62, metalness:0.04, emissive:0xffcc82, emissiveIntensity:1.35});
    var earth=new T.Mesh(new T.SphereGeometry(2.5,160,160), emat); s.add(earth);
    function applyNight(img){ try{ var nt=new T.CanvasTexture(earthNightCanvas(img)); if(T.sRGBEncoding) nt.encoding=T.sRGBEncoding; emat.emissiveMap=nt; emat.needsUpdate=true; }catch(e){} }
    if(EARTH_ALBEDO.complete && EARTH_ALBEDO.naturalWidth) applyNight(EARTH_ALBEDO); else EARTH_ALBEDO.addEventListener('load',function(){ applyNight(EARTH_ALBEDO); });
    var W=1024,H=512; var cl=document.createElement('canvas'); cl.width=W; cl.height=H; var cx2=cl.getContext('2d'); for(var w=0;w<120;w++){ var wx=Math.random()*W, wy=Math.random()*H, wr=10+Math.random()*38; var grd=cx2.createRadialGradient(wx,wy,0,wx,wy,wr); grd.addColorStop(0,'rgba(255,255,255,'+(0.26+Math.random()*0.4)+')'); grd.addColorStop(1,'rgba(255,255,255,0)'); cx2.fillStyle=grd; cx2.beginPath(); cx2.arc(wx,wy,wr,0,6.28); cx2.fill(); }
    var clouds=new T.Mesh(new T.SphereGeometry(2.57,96,96), new T.MeshStandardMaterial({map:new T.CanvasTexture(cl),transparent:true,depthWrite:false,roughness:1,metalness:0,opacity:0.68})); s.add(clouds);
    s.add(atmo(T,2.82,0x7fc6ff,1.05));
    starfield(T,s,soft,2200,36,70,0xffffff,0.28,0.7);
    var flare=sprite(T,soft,0xFFEAC6,7); flare.position.set(18,5,-4); s.add(flare);
    cam.position.set(0,1.0,14);
    var t0=null;
    return function(t){ if(t0===null)t0=t; var lt=t-t0; earth.rotation.y=0.5+lt*0.045; clouds.rotation.y=0.5+lt*0.06;
      var k=eo(Math.min(1,lt/6.0)); var rad=15-9.5*k; var ang=-0.2+lt*0.05;
      cam.position.set(Math.sin(ang)*rad, 0.8+1.6*k, Math.cos(ang)*rad); cam.lookAt(0,0.2,0); };
  },

  /* ===================== CITY (aerial -> street) ===================== */
  city: function(api){ var T=api.THREE, s=api.scene, cam=api.camera; var soft=softTex(T); var city=buildCity(T,s,api,soft);
    cam.position.set(0,44,44);
    var t0=null;
    return function(t){ if(t0===null)t0=t; var lt=t-t0; city.updateCars(lt);
      var k=eio(Math.min(1,lt/5.0)); var y=44-28*k; var z=44-lt*6.5;
      cam.position.set(Math.sin(lt*0.18)*4.0, y, z);
      cam.lookAt(Math.sin(lt*0.18)*2.0, y-18, z-34); cam.rotateZ(Math.sin(lt*0.5)*0.03); };
  },

  /* ===================== CITY CTA (settled street hero) ===================== */
  cityCta: function(api){ var T=api.THREE, s=api.scene, cam=api.camera; var soft=softTex(T); var city=buildCity(T,s,api,soft);
    cam.position.set(0,14,22);
    var t0=null;
    return function(t){ if(t0===null)t0=t; var lt=t-t0; city.updateCars(lt);
      cam.position.set(Math.sin(lt*0.14)*2.0, 14+Math.sin(lt*0.2)*0.6, 22-lt*0.7);
      cam.lookAt(0, -2, -30); };
  }
};
const TIMINGS = [ { time:0.0, slide:1 }, { time:6.0, slide:2 }, { time:13.0, slide:3 }, { time:20.0, slide:4 } ];
const SLIDE_LABELS = ['Universe','Earth','City','CTA'];
</script>
<script src="storyboard-engine.js"></script>
<script>
Storyboard.registerPreset('flashOut', { dur:0.5, apply:function(el,p){ el.style.opacity = Math.max(0, 1-p); } });
Storyboard.init({ timings: TIMINGS, labels: SLIDE_LABELS, fallbackDuration: 26 });
</script>
